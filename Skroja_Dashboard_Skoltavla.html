<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skröja Skoltavla</title>
  <style>
@import url('https://fonts.googleapis.com/css2?family=Allura&family=Patrick+Hand&family=Schoolbell&display=swap');

/* SKRÖJA - KLASSISK SKOLTAVLA
   Visuell redesign. HTML-struktur och all befintlig JavaScript-funktion bevaras. */
:root{
  --ink:#f3f0e3;
  --chalk:#f3f0e3;
  --chalk-soft:#d9dbcc;
  --chalk-faint:rgba(242,241,225,.38);
  --grid-line:rgba(240,239,221,.43);
  --board:#252d29;
  --wood-light:#ad7949;
  --wood-dark:#5c371f;
  --sans:"Patrick Hand",cursive;
  --serif:"Patrick Hand",cursive;
}
*{box-sizing:border-box}
html{background:#171b18}
body{margin:0;min-height:100vh;color:var(--chalk);font-family:var(--sans);background:#151915}
.frame{
  position:relative;display:flex;flex-direction:column;min-height:100vh;padding:17px;
  background:linear-gradient(90deg,rgba(0,0,0,.23),transparent 3%,rgba(255,255,255,.12) 5%,transparent 8%,transparent 92%,rgba(255,255,255,.09) 96%,rgba(0,0,0,.30)),
    repeating-linear-gradient(94deg,transparent 0 12px,rgba(53,29,14,.075) 13px 15px,transparent 16px 41px),
    linear-gradient(115deg,#82532f 0%,#bb8a57 20%,#9b683b 45%,#674124 75%,#986335 100%);
  box-shadow:inset 0 0 0 2px #4d2f1c,inset 0 0 0 5px rgba(242,206,158,.18),inset 0 0 20px rgba(0,0,0,.50);
}
.frame::after{
  content:"";pointer-events:none;position:absolute;bottom:0;left:0;right:0;height:12px;z-index:4;
  background:linear-gradient(#ba8854,#6c4327 45%,#432919);
  box-shadow:0 -3px 5px rgba(0,0,0,.22),inset 0 1px rgba(255,231,180,.38);
}
.board{
  position:relative;isolation:isolate;display:flex;flex-direction:column;min-height:calc(100vh - 34px);
  padding:20px 23px 24px;border-radius:2px;overflow:hidden;
  background:
    radial-gradient(ellipse at 24% 22%,rgba(246,244,224,.065),transparent 34%),
    radial-gradient(ellipse at 72% 61%,rgba(236,236,216,.045),transparent 29%),
    radial-gradient(ellipse at 32% 88%,rgba(255,255,246,.04),transparent 23%),
    repeating-linear-gradient(4deg,rgba(255,255,255,.007) 0 2px,transparent 3px 13px),
    linear-gradient(122deg,#313a34 0%,#28322d 42%,#202822 100%);
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.65),inset 0 0 0 5px rgba(255,255,255,.035),inset 0 14px 30px rgba(0,0,0,.28),inset 0 -15px 35px rgba(0,0,0,.3);
}
.board::before{content:"";pointer-events:none;position:absolute;inset:0;z-index:0;opacity:.32;
  background:repeating-radial-gradient(circle at 13% 37%,transparent 0 4px,rgba(255,255,255,.012) 5px 6px,transparent 7px 14px);
}
.board>*{position:relative;z-index:1}
.top{display:grid;grid-template-columns:210px minmax(0,1fr) 200px;gap:18px;align-items:start;margin-bottom:28px}
.top-left{width:100%;position:relative}
.center{text-align:center;padding-top:2px}
.logo-wrap{display:flex;justify-content:center;align-items:center;transform:translateY(-10px)}
.logo-wrap img{max-height:280px;max-width:100%;width:auto;object-fit:contain;filter:drop-shadow(0 3px 5px rgba(0,0,0,.25))}
.title{font-family:"Schoolbell",cursive;font-size:clamp(2.4rem,3.6vw,3.4rem);font-weight:400;background:none;box-shadow:none;color:var(--chalk)}

/* Ingen kork, inga papperslappar och inga häftstift. */
.pin-note,.qr-note,.name,.card,.calendar-heading,.dashboard-heading,.weekly-schedule-heading,.kiosk-contact-note{
  color:var(--chalk);background:transparent;border:none;box-shadow:none;border-radius:0;
  font-family:var(--sans);text-shadow:0 0 1px rgba(250,250,237,.23);
}
.pin-note::before,.pin-note::after,.qr-note::before,.qr-note::after,
.name::before,.name::after,.card::before,.card::after,
.calendar-heading::before,.calendar-heading::after,
.dashboard-heading::before,.dashboard-heading::after,
.weekly-schedule-heading::before,.weekly-schedule-heading::after,
.kiosk-contact-note::before,.kiosk-contact-note::after,
.calendar-event::before,.weekly-member::before,.weekly-wednesday-note::before{content:none!important;display:none!important}
.pin-note{width:85%;margin:8px auto 0;padding:4px;display:flex;justify-content:center;align-items:center;transform:none}
.pin-note button{width:100%;padding:9px 12px;background:rgba(250,250,235,.035);border:1px solid var(--chalk-faint);border-radius:3px;
  color:var(--chalk);font:1.2rem var(--sans);cursor:pointer}
.pin-note button:hover{background:rgba(255,255,255,.10)}
.status{display:none}
.qr-note{padding:8px 10px 5px;margin-top:4px;transform:none;text-align:center}
.qr-title{margin:0 0 7px;font-size:1.22rem;font-weight:400;letter-spacing:.02em;color:var(--chalk)}
#qrcode{width:154px;height:154px;margin:4px auto 8px;padding:7px;display:flex;justify-content:center;align-items:center;background:#fff;border-radius:2px}
#qrcode img{display:block;width:140px;height:140px}

/* Kritskrivna aktiviteter direkt på tavlan. Färger antyds endast av kritstreck. */
.rows{display:grid;gap:15px;margin-top:2px}
.user-row{display:grid;grid-template-columns:125px minmax(0,1fr);gap:14px;align-items:start}
.name{min-width:0;padding:5px 4px 7px;justify-self:stretch;position:relative;transform:none;
  font:1.35rem/1.2 "Schoolbell",cursive;text-align:center;border-bottom:2px solid rgba(245,244,228,.62)}
.lane{display:flex;gap:13px;min-height:66px;align-items:flex-start;flex-wrap:wrap;padding:2px 4px 8px;
  width:100%;max-width:100%;background:transparent!important;border:none!important;box-shadow:none!important}
.featured-lane{width:100%;max-width:100%;align-content:flex-start}
.card{position:relative;display:grid;align-content:start;gap:5px;min-height:65px;width:min(300px,100%);
  padding:8px 10px 11px;border:1px solid rgba(244,244,225,.32);border-radius:2px;
  background:rgba(236,237,219,.018);transform:none!important;overflow-wrap:anywhere}
.lane-blue .card{border-color:rgba(171,203,214,.58)}
.lane-peach .card{border-color:rgba(241,186,156,.58)}
.lane-green .card{border-color:rgba(188,216,166,.58)}
.lane-yellow .card{border-color:rgba(243,222,151,.58)}
.title2{font:1.42rem/1.12 "Patrick Hand",cursive;color:var(--chalk)}
.meta{font:1.02rem/1.2 "Patrick Hand",cursive;color:var(--chalk-soft)}
.thumb{display:block;justify-self:center;width:auto;height:auto;max-width:100%;max-height:220px;object-fit:contain;
  background:transparent;border:0;border-radius:0;margin-top:2px}
.featured-row{margin-bottom:20px;grid-template-columns:125px minmax(0,1fr);align-items:start}
.featured-name{font-size:1.35rem;padding:5px 4px 7px}
.featured-lane .card{min-height:65px}
.featured-lane .title2{font-size:1.42rem}
.featured-lane .meta{font-size:1.02rem}
html.hide-colored-bands .lane{background:transparent!important;border:none!important;box-shadow:none!important}

/* Rubriker = text i krita med en lätt ojämn understrykning. */
.dashboard-heading,.calendar-heading,.weekly-schedule-heading{
  display:block;width:max-content;max-width:95%;margin:0 auto 14px;padding:2px 16px 8px;
  transform:none;color:var(--chalk);text-align:center;
  font:clamp(1.7rem,2.05vw,2.2rem)/1.1 "Schoolbell",cursive;
  border-bottom:2px solid rgba(243,243,223,.68);letter-spacing:.015em;
}
.content-stack{flex:1 1 auto;min-height:0;width:100%;display:flex;flex-direction:column;justify-content:space-between;gap:18px;position:relative;z-index:1}
.dashboard-section{flex:0 0 auto;width:100%}
.dashboard-section .rows{margin-bottom:0}
.content-stack .weekly-schedule-section{flex:0 0 auto;margin:0 20px 0 auto}
.content-stack .calendar-section{flex:0 0 auto;margin-top:0}

/* Veckoschema: vitkritat rutnät och namn i diskret färgkrita. */
.weekly-schedule-section{width:min(88%,1420px);margin:auto 20px 8px auto;font-family:var(--sans)}
.weekly-schedule-wrap{display:grid;grid-template-columns:78px repeat(7,minmax(66px,1fr)) minmax(90px,1.15fr);
  grid-template-rows:39px minmax(75px,auto) minmax(75px,auto);align-items:stretch;color:var(--chalk)}
.weekly-time-labels,.weekly-schedule-grid{display:contents}
.weekly-time-labels .spacer{grid-column:1;grid-row:1;border-bottom:2px solid transparent}
.weekly-time-label{display:flex;align-items:center;justify-content:center;padding:6px 4px;color:var(--chalk);
  font-size:1.05rem;border-right:1.5px solid var(--grid-line);border-bottom:1.5px solid var(--grid-line)}
.weekly-time-label:nth-child(2){grid-column:1;grid-row:2}
.weekly-time-label:nth-child(3){grid-column:1;grid-row:3}
.weekly-day-header,.weekly-slot,.weekly-always-slot{position:relative;border-right:1.5px solid var(--grid-line);border-bottom:1.5px solid var(--grid-line)}
.weekly-day-header{display:flex;align-items:center;justify-content:center;padding:5px 3px;font-size:1.12rem;color:var(--chalk);text-align:center}
.weekly-slot,.weekly-always-slot{padding:8px 5px;display:flex;flex-wrap:wrap;align-content:flex-start;justify-content:center;gap:5px}
.weekly-always-slot{grid-column:9;grid-row:2 / span 2;align-content:center}
.weekly-member{display:inline-block;position:relative;padding:3px 6px;font:1.05rem/1.1 "Patrick Hand",cursive;
  color:#efe8be;text-align:center;background:transparent;border:0;box-shadow:none;transform:none!important;overflow-wrap:anywhere}
.weekly-member:nth-child(3n){color:#c5d9bc}
.weekly-member:nth-child(4n){color:#b6d6e0}
.weekly-schedule-empty,.weekly-schedule-error{padding:14px;text-align:center;opacity:.75}
.weekly-wednesday-note{grid-column:4;grid-row:2 / span 2;align-self:center;justify-self:center;z-index:5;
  width:max-content;max-width:90%;padding:4px 6px;pointer-events:none;background:transparent;border:0;box-shadow:none;
  color:#ead69b;font:1.25rem "Schoolbell",cursive;transform:rotate(-4deg)}

/* Kalender: endast kritlinjer mot svart tavla. */
.calendar-section{width:100%;padding:0 20px;position:relative}
.calendar-section.no-events{display:none}
.calendar-panel{width:100%;margin:0 auto;padding:0;background:none;border:0;box-shadow:none;
  color:var(--chalk);font-family:var(--sans);backdrop-filter:none}
.calendar-weekdays,.calendar-grid{display:grid;grid-template-columns:90px repeat(7,minmax(0,1fr));gap:0}
.calendar-weekdays{margin-bottom:0;text-align:center;color:var(--chalk);font:1.15rem "Patrick Hand",cursive}
.calendar-weekdays>div{position:relative;padding:4px 2px 7px;border-bottom:2px solid var(--grid-line)}
.calendar-weekdays>div::after{content:none!important}
.calendar-month-label{display:flex;align-items:center;justify-content:center;padding:8px 4px;
  border-right:1.5px solid var(--grid-line);border-bottom:1.5px solid var(--grid-line);
  color:var(--chalk-soft);font:1.07rem "Patrick Hand",cursive;text-transform:none;text-shadow:none}
.calendar-grid{position:relative}
.calendar-grid::before{content:"";pointer-events:none;position:absolute;left:0;top:0;bottom:0;width:1.5px;background:var(--grid-line)}
.calendar-day{position:relative;min-width:0;min-height:75px;padding:6px 7px;border-right:1.5px solid var(--grid-line);
  border-bottom:1.5px solid var(--grid-line);background:transparent;border-radius:0}
.calendar-day::before,.calendar-day::after{content:none!important}
.calendar-day.other-month{opacity:.36}
.calendar-date{margin-bottom:3px;color:var(--chalk-soft);font:1.17rem "Patrick Hand",cursive;text-shadow:none}
.calendar-day.today{box-shadow:none}
.calendar-day.today .calendar-date{display:inline-flex;justify-content:center;align-items:center;
  min-width:31px;height:31px;padding:0 5px;border:2px solid #eee9ce;border-radius:50%;font-size:1.14rem;color:var(--chalk);box-shadow:none}
.calendar-event{display:block;position:relative;width:100%;margin:4px 0;padding:2px 3px;
  border:0;border-left:2px solid #e9cc8b;border-radius:0;background:transparent;box-shadow:none;transform:none!important;
  color:#eed59e;font:1.03rem/1.12 "Patrick Hand",cursive;text-align:left;overflow-wrap:anywhere}
.calendar-event:nth-child(3n){color:#bed9c4;border-left-color:#bed9c4}

/* Kiosk/helskärm */
.kiosk-clock{display:none;justify-self:start;align-self:start;position:relative;margin:2px 0 0 8px;
  padding:2px 10px 11px;color:var(--chalk);transform:none}
.kiosk-clock-time{font:4.25rem/.9 "Patrick Hand",cursive;letter-spacing:-.02em;opacity:.96}
.kiosk-clock-date{margin-top:7px;font:1.45rem "Patrick Hand",cursive;opacity:.84}
.kiosk-clock::after{content:"";position:absolute;left:0;bottom:0;width:100%;height:2px;
  background:linear-gradient(90deg,transparent,var(--chalk-faint) 12% 90%,transparent);transform:rotate(-.5deg)}
.kiosk-contact-note{display:none;position:absolute;left:225px;top:42px;z-index:4;width:190px;margin:0;
  padding:7px 10px;color:var(--chalk);transform:none;border-left:2px solid var(--chalk-faint);background:rgba(27,35,29,.56)}
.kiosk-contact-title{margin:0 0 6px;font:1.18rem "Schoolbell",cursive}
.kiosk-contact-row{display:grid;grid-template-columns:72px 1fr;gap:6px;font:1.02rem/1.4 "Patrick Hand",cursive}
:fullscreen .kiosk-clock,:fullscreen .kiosk-contact-note{display:block}
@media(display-mode:fullscreen){.kiosk-clock,.kiosk-contact-note{display:block}.pin-note{display:none}}

.footer{flex:0 0 auto;display:flex;justify-content:center;align-items:center;gap:12px;margin-top:10px;
  padding:0 0 3px;position:relative;z-index:1;transform:none;color:var(--chalk)}
.footer-small{position:relative;padding:3px 9px;text-transform:uppercase;letter-spacing:.08em;
  color:var(--chalk-soft);font:1.03rem "Patrick Hand",cursive;text-shadow:none}
.footer-small::before,.footer-small::after{content:"";position:absolute;left:0;right:0;height:1px;background:var(--chalk-faint)}
.footer-small::before{top:0}.footer-small::after{bottom:0}
.footer-brand{font:2.2rem "Allura",cursive;color:var(--chalk);text-shadow:none}
.footer-logo{display:block;width:135px;max-width:45vw;height:auto;object-fit:contain;filter:drop-shadow(0 3px 4px rgba(0,0,0,.32))}
#night-screen{position:fixed;inset:0;background:#000;z-index:99999;display:none}

/* Responsiv layout - bevara grid-placering och kioskvisning. */
@media(max-width:1180px){
  .top{grid-template-columns:1fr;justify-items:center}
  .pin-note,.qr-note{width:min(100%,420px)}
  .user-row,.featured-row{grid-template-columns:1fr}
  .name{justify-self:start;min-width:110px;margin-left:0}
  .weekly-schedule-section,.content-stack .weekly-schedule-section{width:100%;margin-left:0;margin-right:0}
  .weekly-schedule-wrap{grid-template-columns:67px repeat(7,minmax(52px,1fr)) minmax(77px,1fr)}
  .weekly-member{font-size:.95rem}
}
@media(max-width:860px){
  .frame{padding:10px}.board{min-height:calc(100vh - 20px);padding:12px 9px 22px}
  .calendar-section{padding:0 2px}
  .calendar-weekdays,.calendar-grid{grid-template-columns:47px repeat(7,minmax(0,1fr))}
  .calendar-weekdays{font-size:.8rem}
  .calendar-day{min-height:47px;padding:3px}
  .calendar-date,.calendar-month-label{font-size:.82rem}
  .calendar-event{font-size:.73rem;padding:2px}
  .weekly-schedule-wrap{grid-template-columns:49px repeat(7,minmax(0,1fr)) minmax(55px,1.1fr)}
  .weekly-member,.weekly-time-label,.weekly-day-header{font-size:.8rem}
  .weekly-slot,.weekly-always-slot{padding:4px 2px}
  .weekly-wednesday-note{font-size:.9rem}
  .card{width:min(300px,100%)}
  .kiosk-contact-note{left:5px;top:105px}
}

/* Raspberry Pi: behåll originalets 90-gradersrotation. */
html.raspberry-pi,html.raspberry-pi body{width:100%;height:100%;margin:0;overflow:hidden;background:#000}
html.raspberry-pi body{position:fixed;width:100vh;height:100vw;min-width:100vh;min-height:100vw;
  left:100vw;top:0;transform-origin:top left;transform:rotate(90deg)}
html.raspberry-pi .frame{width:100vh;min-width:100vh;height:100vw;min-height:100vw}
html.raspberry-pi .board{width:calc(100vh - 34px);min-width:calc(100vh - 34px);
  height:calc(100vw - 34px);min-height:calc(100vw - 34px)}

  </style>
</head>

  <script>

const SHOW_COLORED_BANDS = false;  // true = visa färgade band, false = dölj dem
document.documentElement.classList.toggle('hide-colored-bands', !SHOW_COLORED_BANDS);



/* =========================================================
 * Veckoschema från Skroja_members.csv
 * ========================================================= */
const weeklyScheduleGrid = document.getElementById('weekly-schedule-grid');
const membersCsvFileName = 'Skroja_members.csv';

function normalizeText(value) {
  return String(value || '').trim();
}

function parseSemicolonCsv(text) {
  const lines = String(text || '')
    .replace(/^\uFEFF/, '')
    .split(/\r?\n/)
    .filter(line => line.trim() !== '');

  if (!lines.length) return [];

  const headers = lines[0]
    .split(';')
    .map(header => normalizeText(header).toLowerCase());

  return lines.slice(1).map(line => {
    const values = line.split(';');
    const record = {};
    headers.forEach((header, index) => {
      record[header] = normalizeText(values[index]);
    });
    return record;
  });
}

function getScheduleDayIndex(dayName) {
  const normalized = normalizeText(dayName).toLowerCase();
  const dayMap = {
    'måndag': 0,
    'mandag': 0,
    'tisdag': 1,
    'onsdag': 2,
    'torsdag': 3,
    'fredag': 4,
    'lördag': 5,
    'lordag': 5,
    'söndag': 6,
    'sondag': 6
  };
  return dayMap[normalized];
}

function getScheduleTimeRow(timeName) {
  const normalized = normalizeText(timeName).toLowerCase();
  if (normalized === 'förmiddag' || normalized === 'formiddag') return 2;
  if (normalized === 'eftermiddag') return 3;
  return null;
}

function createWeeklyMemberTag(name) {
  const tag = document.createElement('span');
  tag.className = 'weekly-member';
  tag.textContent = name;
  return tag;
}

function renderWeeklySchedule(members) {
  if (!weeklyScheduleGrid) return;
  weeklyScheduleGrid.innerHTML = '';

  const dayLabels = ['Mån','Tis','Ons','Tor','Fre','Lör','Sön','Alltid'];
  dayLabels.forEach((label, index) => {
    const header = document.createElement('div');
    header.className = 'weekly-day-header';
    header.textContent = label;
    header.style.gridColumn = String(index + 2);
    header.style.gridRow = '1';
    weeklyScheduleGrid.appendChild(header);
  });

  const slots = new Map();

  for (let row = 2; row <= 3; row++) {
    for (let col = 1; col <= 7; col++) {
      const slot = document.createElement('div');
      slot.className = 'weekly-slot';
      slot.style.gridColumn = String(col + 1);
      slot.style.gridRow = String(row);
      weeklyScheduleGrid.appendChild(slot);
      slots.set(`${row}-${col}`, slot);
    }
  }

  const alwaysSlot = document.createElement('div');
  alwaysSlot.className = 'weekly-always-slot';
  weeklyScheduleGrid.appendChild(alwaysSlot);

  /* Onsdagar är spärrade för Skröja. */
  const wednesdayNote = document.createElement('div');
  wednesdayNote.className = 'weekly-wednesday-note';
  wednesdayNote.textContent = 'Skröja';
  weeklyScheduleGrid.appendChild(wednesdayNote);

  let placedCount = 0;

  members.forEach(member => {
    const name = normalizeText(member.namn);
    const level = normalizeText(member.medlemsniva).toLowerCase();
    if (!name) return;

    if (level === 'alltid') {
      alwaysSlot.appendChild(createWeeklyMemberTag(name));
      placedCount++;
      return;
    }

    if (level !== 'ofta') return;

    const dayIndex = getScheduleDayIndex(member.dag);
    const row = getScheduleTimeRow(member.tid);
    if (dayIndex === undefined || row === null) return;

    /* Onsdag är reserverad för Skröja och visar därför inga medlemslappar. */
    if (dayIndex === 2) return;

    const targetSlot = slots.get(`${row}-${dayIndex + 1}`);
    if (!targetSlot) return;

    targetSlot.appendChild(createWeeklyMemberTag(name));
    placedCount++;
  });

  if (!placedCount) {
    const empty = document.createElement('div');
    empty.className = 'weekly-schedule-empty';
    empty.style.gridColumn = '1 / -1';
    empty.style.gridRow = '2 / span 2';
    empty.textContent = 'Inga schemalagda medlemmar hittades.';
    weeklyScheduleGrid.appendChild(empty);
  }

}

async function loadWeeklySchedule() {
  if (!weeklyScheduleGrid) return;

  try {
    const query = azureConfig.sasToken.replace(/^\?/, '');
    const membersCsvUrl = `${getBlobBaseUrl()}/${encodeURIComponent(membersCsvFileName)}?${query}&_=${Date.now()}`;
    const response = await fetch(membersCsvUrl, { cache:'no-store' });
    if (!response.ok) {
      throw new Error(`Kunde inte läsa ${membersCsvFileName} från Azure (${response.status})`);
    }

    const csvText = await response.text();
    const members = parseSemicolonCsv(csvText);

    renderWeeklySchedule(members);
    updateDashboardUsersFromMembers(members);

    /*
     * Om medlemslistan har ändrats måste även Anslagstavlan byggas om,
     * även om aktivitets-JSON-filerna är oförändrade.
     */
    if (hasLoadedOnce) {
      await loadActivities(true);
    }
  } catch (error) {
    console.error(error);
    weeklyScheduleGrid.innerHTML = '';
    const message = document.createElement('div');
    message.className = 'weekly-schedule-error';
    message.style.gridColumn = '1 / -1';
    message.style.gridRow = '1 / -1';
    message.textContent = 'Veckoschemat kunde inte läsa Skroja_members.csv';
    weeklyScheduleGrid.appendChild(message);
  }
}

function isRaspberryPi() {
  const params =
    new URLSearchParams(window.location.search);

  if (params.get('raspberrypi') === '1') {
    return true;
  }

  const userAgent =
    (navigator.userAgent || '').toLowerCase();

  const platform =
    (navigator.platform || '').toLowerCase();

  const isLinux =
    userAgent.includes('linux') ||
    platform.includes('linux');

  const isArm =
    userAgent.includes('arm') ||
    userAgent.includes('aarch64') ||
    platform.includes('arm') ||
    platform.includes('aarch64');

  return isLinux && isArm;
}

async function listJsonBlobs() {
  const { accountName, containerName, sasToken } = azureConfig;
  if (!accountName || !containerName || !sasToken || sasToken.includes('PASTA_IN')) {
    throw new Error('Azure-inställningar saknas. Lägg in en giltig SAS-token i dashboardfilen.');
  }

  const query = sasToken.replace(/^\?/, '');
  const url = `https://${accountName}.blob.core.windows.net/${containerName}?restype=container&comp=list&include=metadata&${query}`;
  const response = await fetch(url);
  if (!response.ok) throw new Error(`Kunde inte läsa från Azure (${response.status}).`);

  const xml = await response.text();
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  const blobNodes = Array.from(doc.querySelectorAll('Blob'));

  return blobNodes
    .map(blob => {
      const name = blob.querySelector('Name')?.textContent || '';
      const lastModified = blob.querySelector('Properties > Last-Modified')?.textContent || '';
      return { name, lastModified };
    })
    .filter(blob => blob.name.endsWith('.json'));
}

    async function readJsonRecord(fileName) {
      const query = azureConfig.sasToken.replace(/^\?/, '');
      const url = `${getBlobBaseUrl()}/${encodeURIComponent(fileName)}?${query}`;
      const response = await fetch(url);
      if (!response.ok) throw new Error(`Kunde inte läsa ${fileName}`);
      return response.json();
    }

function isNightMode() {
  const now = new Date();
  const minutes = now.getHours() * 60 + now.getMinutes();
  return minutes >= (22 * 60 + 30) || minutes < (7 * 60 + 30);
}

function updateNightMode() {
  const night = isNightMode();
  nightScreen.style.display = night ? 'block' : 'none';

async function loadActivities(force = false) {
  if (pollStatus) pollStatus.textContent = '';

  const files = await listJsonBlobs();

  const sortedFiles = files
    .slice()
    .sort((a, b) =>
      a.name.localeCompare(b.name)
    )
    .reverse();

  /*
   * Signaturen innehåller ALLA JSON-filer.
   *
   * Därmed märker dashboarden:
   * - ny aktivitet
   * - borttagen aktivitet
   * - ändrad aktivitet
   * - nytt/borttaget kalenderevent
   */
  const fileSignature = sortedFiles
    .map(file =>
      `${file.name}:${file.lastModified}`
    )
    .join('|');

  if (
    !force &&
    hasLoadedOnce &&
    fileSignature === lastSeenFileSignature
  ) {
    return;
  }

  lastSeenFileSignature = fileSignature;
  hasLoadedOnce = true;

  /*
   * Läs alla JSON-poster.
   *
   * Det behövs för kalendern eftersom ett framtida event
   * kan ha skapats för länge sedan.
   */
  const allFiles =
    sortedFiles.map(file => file.name);

  const records = await Promise.all(
    allFiles.map(readJsonRecord)
  );

  /*
   * --------------------------------
   * KALENDER
   * --------------------------------
   */

  const calendarEvents = records
    .filter(record =>
      record &&
      record.activity === 'Kalenderevent' &&
      record.eventDate
    );

  renderCalendar(calendarEvents);

  /*
   * --------------------------------
   * VANLIGA AKTIVITETER
   * --------------------------------
   */

  const cutoff =
    Date.now() -
    (14 * 24 * 60 * 60 * 1000);

  const byUser = Object.fromEntries(
    users.map(user => [user.name, []])
  );

  records
    .filter(record =>
      record &&
      record.member &&
      record.timestamp
    )

    .filter(record => {
      const ts =
        new Date(record.timestamp).getTime();

      return (
        Number.isFinite(ts) &&
        ts >= cutoff
      );
    })

    /*
     * Kalenderevent ska INTE visas
     * som vanliga aktivitetskort.
     */
    .filter(record =>
      record.activity !== 'Kalenderevent'
    )

    .filter(record =>
      !hiddenActivities.includes(
        record.activity
      )
    )

    .sort(
      (a, b) =>
        new Date(b.timestamp) -
        new Date(a.timestamp)
    )

    .forEach(record => {
      if (!byUser[record.member]) return;

      if (
        record.member === 'Lerverkstan' ||
        byUser[record.member].length < 4
      ) {
        byUser[record.member].push(record);
      }
    });

  renderRows(byUser);

  if (pollStatus) {
    pollStatus.textContent = '';
  }
}

function renderCalendar(events) {
  if (!calendarPanel || !calendarGrid) return;

  const validEvents = events
    .filter(event =>
      event &&
      event.activity === 'Kalenderevent' &&
      event.eventDate
    )
    .sort((a, b) =>
      a.eventDate.localeCompare(b.eventDate)
    );

  const today = new Date();

  // Måndag i nuvarande vecka
  const calendarStart = new Date(today);

  const daysSinceMonday =
    (today.getDay() + 6) % 7;

  calendarStart.setDate(
    today.getDate() - daysSinceMonday
  );

  calendarStart.setHours(0, 0, 0, 0);

  calendarGrid.innerHTML = '';

  /*
   * 6 veckor
   */
  for (let week = 0; week < 6; week++) {

    /*
     * -----------------------------------------
     * Bestäm vilken månad som "vinner" veckan
     * -----------------------------------------
     */

    const monthCounts = new Map();

    for (let dayIndex = 0; dayIndex < 7; dayIndex++) {

      const date = new Date(calendarStart);

      date.setDate(
        calendarStart.getDate() +
        week * 7 +
        dayIndex
      );

      const key =
        `${date.getFullYear()}-${date.getMonth()}`;

      if (!monthCounts.has(key)) {
        monthCounts.set(key, {
          count:0,
          date:new Date(date)
        });
      }

      monthCounts.get(key).count++;
    }

    const winningMonth =
      [...monthCounts.values()]
        .sort((a, b) =>
          b.count - a.count
        )[0];

    /*
     * Månad till vänster
     */

    const monthLabel =
      document.createElement('div');

    monthLabel.className =
      'calendar-month-label';

    const monthName =
      new Intl.DateTimeFormat(
        'sv-SE',
        { month:'short' }
      )
        .format(winningMonth.date)
        .replace('.', '');

    monthLabel.textContent =
      monthName;

    calendarGrid.appendChild(
      monthLabel
    );


    /*
     * -----------------------------------------
     * Veckans 7 dagar
     * -----------------------------------------
     */

    for (let dayIndex = 0; dayIndex < 7; dayIndex++) {

      const i =
        week * 7 + dayIndex;

      const currentDate =
        new Date(calendarStart);

      currentDate.setDate(
        calendarStart.getDate() + i
      );

      const year =
        currentDate.getFullYear();

      const month =
        currentDate.getMonth();

      const day =
        currentDate.getDate();

      const dateString = [
        year,
        String(month + 1).padStart(2, '0'),
        String(day).padStart(2, '0')
      ].join('-');


      const dayElement =
        document.createElement('div');

      dayElement.className =
        'calendar-day';


      /*
       * Idag
       */

      const isToday =
        year === today.getFullYear() &&
        month === today.getMonth() &&
        day === today.getDate();

      if (isToday) {
        dayElement.classList.add('today');
      }


      /*
       * Datum
       */

      const dateElement =
        document.createElement('div');

      dateElement.className =
        'calendar-date';

      dateElement.textContent =
        day;

      dayElement.appendChild(
        dateElement
      );


      /*
       * Event
       */

      const todaysEvents =
        validEvents.filter(event =>
          event.eventDate === dateString
        );

      todaysEvents.forEach(event => {

        const eventElement =
          document.createElement('div');

        eventElement.className =
          'calendar-event';

        eventElement.textContent =
          event.eventDescription ||
          'Kalenderevent';

        dayElement.appendChild(
          eventElement
        );
      });

      calendarGrid.appendChild(
        dayElement
      );
    }
  }
}

function scheduleDailyCodeReload() {
  function scheduleNextReload() {
    const now = new Date();
    const nextReload = new Date(now);

    nextReload.setHours(6, 0, 0, 0);

    if (now >= nextReload) {
      nextReload.setDate(nextReload.getDate() + 1);
    }

    const delay = nextReload.getTime() - now.getTime();

    setTimeout(() => {
      const url = new URL(window.location.href);

      // Forces the browser/CDN to request the newest HTML.
      url.searchParams.set('_refresh', Date.now());

      // Reload at 06:00 every morning without adding browser history.
      window.location.replace(url.toString());
    }, delay);
  }

  scheduleNextReload();
}

function setupKioskMouseCursor() {
  let mouseHideTimer = null;

  function showMouseCursor() {
    document.body.style.cursor = 'default';

    if (mouseHideTimer) {
      clearTimeout(mouseHideTimer);
    }

    mouseHideTimer = setTimeout(() => {
      document.body.style.cursor = 'none';
    }, 3000);
  }

  document.addEventListener('mousemove', showMouseCursor);
  document.addEventListener('mousedown', showMouseCursor);
  document.addEventListener('wheel', showMouseCursor);

  showMouseCursor();
}
