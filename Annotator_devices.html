<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Annotator Device Map</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    html, body { height: 100%; margin: 0; font-family: system-ui, Segoe UI, Roboto, Arial, sans-serif; }
    body { display: flex; flex-direction: column; background: #f6f6f7; color: #111; }

    #topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 10px 14px;
      background: #f6f6f7;
      border-bottom: 1px solid #ddd;
      z-index: 1000;
    }

    #brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    #brand-logo {
      display: block;
      height: 42px;
      width: auto;
      max-width: 180px;
      object-fit: contain;
      flex: 0 0 auto;
    }

    #title {
      font-size: 18px;
      font-weight: 700;
      white-space: nowrap;
      line-height: 1;
      transform: translateY(-4px); /* optical alignment with logo artwork */
    }

    #topbar-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      flex-wrap: wrap;
      min-width: 0;
    }

    #topbar-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .control-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #333;
      white-space: nowrap;
    }

    #age-filter, #refresh-now {
      min-height: 34px;
      box-sizing: border-box;
      border: 1px solid #bbb;
      border-radius: 5px;
      background: #fff;
      color: #111;
      font: inherit;
      font-size: 13px;
    }

    #age-filter { padding: 5px 28px 5px 8px; }

    #refresh-now {
      padding: 5px 12px;
      cursor: pointer;
      font-weight: 600;
    }

    #refresh-now:hover:not(:disabled) { background: #f1f1f1; }
    #refresh-now:disabled { cursor: wait; opacity: .6; }

    #status-wrap {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 5px;
      min-width: 300px;
    }

    #status { font-size: 13px; color: #555; text-align: right; }
    #status.error { color: #b00020; }

    #read-progress {
      width: 300px;
      height: 7px;
      background: #dedee1;
      border-radius: 999px;
      overflow: hidden;
      display: none;
    }

    #read-progress.visible { display: block; }

    #read-progress-fill {
      width: 0%;
      height: 100%;
      background: #1565c0;
      border-radius: inherit;
      transition: width .18s ease;
    }

    #main {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 620px;
      gap: 0;
    }

    #map { min-height: 0; }

    #device-panel {
      min-width: 0;
      overflow: auto;
      background: #fff;
      border-left: 1px solid #ddd;
      padding: 14px;
    }

    #device-panel h2 {
      margin: 0 0 10px;
      font-size: 16px;
    }

    #device-summary {
      margin-bottom: 10px;
      color: #555;
      font-size: 12px;
    }

    #device-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      background: #fff;
    }

    #device-table th, #device-table td {
      border-bottom: 1px solid #e5e5e5;
      padding: 8px 7px;
      text-align: left;
      vertical-align: top;
    }

    #device-table th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: #f5f5f5;
      font-weight: 700;
      white-space: nowrap;
    }

    #device-table tbody tr { cursor: pointer; }
    #device-table tbody tr:hover { background: #f3f7ff; }
    #device-table tbody tr.selected { background: #dce9ff; }

    .status-pill {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid rgba(0,0,0,.12);
      white-space: nowrap;
    }
    .status-active { background: #dff5e4; color: #176b2c; }
    .status-recent { background: #fff3cd; color: #7a5a00; }
    .status-offline { background: #eee; color: #555; }
    .status-nogps { background: #f8d7da; color: #842029; }

    .muted { color: #777; }

    @media (max-width: 1100px) {
      #topbar { align-items: flex-start; }
      #topbar-right { align-items: flex-end; }
      #main { grid-template-columns: 1fr; grid-template-rows: minmax(420px, 58vh) auto; }
      #device-panel { border-left: 0; border-top: 1px solid #ddd; }
    }

    @media (max-width: 700px) {
      #topbar { flex-direction: column; align-items: stretch; }
      #topbar-right { justify-content: space-between; align-items: center; }
      #status-wrap {
        align-items: flex-start;
        min-width: 0;
        width: 100%;
      }
      #status { text-align: left; flex-basis: 100%; }
      #read-progress { width: min(300px, 100%); }
    }

    .device-label {
      background: rgba(255,255,255,0.95);
      border: 1px solid #333;
      border-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,.25);
      color: #111;
      font-size: 12px;
      font-weight: 700;
      padding: 3px 6px;
      white-space: nowrap;
    }

    .active-direction-marker {
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
    }

    .active-direction-arrow {
      width: 0;
      height: 0;
      border-left: 9px solid transparent;
      border-right: 9px solid transparent;
      border-bottom: 24px solid #1565c0;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,.5));
      transform-origin: 50% 55%;
    }

    .zoom-out-control button {
      border: 0;
      background: #fff;
      color: #222;
      font: 600 12px/1.2 system-ui, Segoe UI, Roboto, Arial, sans-serif;
      padding: 0 10px;
      height: 32px;
      min-width: 76px;
      cursor: pointer;
      border-radius: 2px;
    }

    .zoom-out-control button:hover { background: #f4f4f4; }
    .zoom-out-control button:focus-visible {
      outline: 2px solid #1565c0;
      outline-offset: -2px;
    }

    .device-popup { font-size: 13px; line-height: 1.45; min-width: 300px; }
    .device-popup strong { font-size: 14px; }
    .device-popup .streetview-wrap { margin-top: 9px; }
    .device-popup .streetview-title { font-weight: 700; margin-bottom: 4px; }
    .device-popup .streetview-frame { width: 100%; height: 180px; border: 0; border-radius: 6px; display: block; background: #eee; }
    .device-popup .streetview-link { display: inline-block; margin-top: 4px; font-size: 12px; }
  </style>
  <link rel="icon" type="image/png" href="favicon_speed_D_carbon_bold.png">
</head>
<body>
  <div id="topbar">
    <div id="brand">
      <img id="brand-logo" src="./AnnotatorLogo.png" alt="Annotator logo" />
      <div id="title">Device positions</div>
    </div>
    <div id="topbar-right">
      <div id="topbar-controls">
        <label class="control-label" for="age-filter">
          Show tests from
          <select id="age-filter">
            <option value="1w" selected>1 week</option>
            <option value="2w">2 weeks</option>
            <option value="1m">1 month</option>
            <option value="3m">3 months</option>
          </select>
        </label>
        <button id="refresh-now" type="button">Refresh now</button>
      </div>
      <div id="status-wrap">
        <div id="status">Starting…</div>
        <div id="read-progress" role="progressbar" aria-label="Excel file reading progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="read-progress-fill"></div>
        </div>
      </div>
    </div>
  </div>
  <div id="main">
    <div id="map"></div>
    <aside id="device-panel">
      <h2>Device status</h2>
      <div id="device-summary">No data loaded yet.</div>
      <table id="device-table">
        <thead>
          <tr>
            <th>Device</th>
            <th>Status</th>
            <th>Last seen</th>
            <th>Location</th>
            <th>Test purpose</th>
            <th>Participants</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </aside>
  </div>

  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // ==========================================================
    // CONFIG
    // ==========================================================

    // Extracted from the existing Annotator Reports Viewer.
    const ACCOUNT   = 'annotationcsv';
    const CONTAINER = 'csv';
    const SAS_TOKEN = 'sv=2024-11-04&ss=bfqt&srt=co&sp=rwdlacupiytfx&se=2026-12-31T14:25:22Z&st=2026-01-02T06:10:22Z&spr=https&sig=EYJzJkVswHh9jljAsy506gTIQ7fQMGuF6kJUCSIx%2BZQ%3D';
    const BASE_URL  = `https://${ACCOUNT}.blob.core.windows.net/${CONTAINER}`;

    // CSV placed beside this HTML file.
    const DEVICE_MAPPING_CSV = './Device_ID_mapping.csv';

    // User-selectable age filter. Default is one week.
    const DEFAULT_AGE_FILTER = '1w';

    // Re-scan Azure every five minutes.
    const REFRESH_INTERVAL_MS = 5 * 60 * 1000;

    // ==========================================================
    // STATE
    // ==========================================================

    const fileCache = new Map();
    // filename -> { lastModifiedMs, deviceId, lat, lon, coordinateTimestamp, filename }

    const map = L.map('map').setView([57.7, 12.0], 6);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const markerLayer = L.layerGroup().addTo(map);
    const markersByDevice = new Map();

    // Fit the map so every currently displayed device is visible.
    function zoomToAllDevices() {
      const latLngs = Array.from(markersByDevice.values())
        .map(marker => marker.getLatLng())
        .filter(Boolean);

      if (!latLngs.length) return;

      if (latLngs.length === 1) {
        map.setView(latLngs[0], 13);
      } else {
        map.fitBounds(L.latLngBounds(latLngs), {
          padding: [40, 40],
          maxZoom: 14
        });
      }
    }

    // Leaflet map control: always visible on the map.
    const ZoomOutControl = L.Control.extend({
      options: { position: 'topleft' },
      onAdd() {
        const container = L.DomUtil.create('div', 'leaflet-bar zoom-out-control');
        const button = L.DomUtil.create('button', '', container);
        button.type = 'button';
        button.textContent = 'Zoom out';
        button.title = 'Show all devices';
        button.setAttribute('aria-label', 'Zoom out to show all devices');

        L.DomEvent.disableClickPropagation(container);
        L.DomEvent.disableScrollPropagation(container);
        L.DomEvent.on(button, 'click', (event) => {
          L.DomEvent.stop(event);
          zoomToAllDevices();
        });

        return container;
      }
    });

    map.addControl(new ZoomOutControl());

    let firstSuccessfulRender = true;
    let refreshInProgress = false;
    let selectedDeviceId = null;
    let currentAgeFilter = DEFAULT_AGE_FILTER;

    // ==========================================================
    // HELPERS
    // ==========================================================

    function setStatus(text, isError = false) {
      const el = document.getElementById('status');
      el.textContent = text;
      el.classList.toggle('error', isError);
    }

    function setReadProgress(done, total) {
      const progress = document.getElementById('read-progress');
      const fill = document.getElementById('read-progress-fill');
      if (!progress || !fill) return;

      const safeTotal = Math.max(1, Number(total) || 1);
      const safeDone = Math.max(0, Math.min(safeTotal, Number(done) || 0));
      const percent = (safeDone / safeTotal) * 100;

      progress.classList.add('visible');
      progress.setAttribute('aria-valuenow', String(Math.round(percent)));
      fill.style.width = percent + '%';
      setStatus(`Analyzing test data files ${safeDone} / ${safeTotal}…`);
    }

    function hideReadProgress() {
      const progress = document.getElementById('read-progress');
      const fill = document.getElementById('read-progress-fill');
      if (progress) {
        progress.classList.remove('visible');
        progress.setAttribute('aria-valuenow', '0');
      }
      if (fill) fill.style.width = '0%';
    }

    function nc(url) {
      return url + (url.includes('?') ? '&' : '?') + 'ts=' + Date.now();
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function normalizeKey(value) {
      return String(value ?? '')
        .trim()
        .toLowerCase()
        .replace(/[\s_\-:]+/g, '');
    }

    function isValidCoordinate(lat, lon) {
      return Number.isFinite(lat) && Number.isFinite(lon) &&
             lat >= -90 && lat <= 90 && lon >= -180 && lon <= 180 &&
             !(lat === 0 && lon === 0);
    }

    function getAgeCutoffMs(filterValue = currentAgeFilter) {
      const cutoff = new Date();

      if (filterValue === '1w') {
        cutoff.setDate(cutoff.getDate() - 7);
      } else if (filterValue === '2w') {
        cutoff.setDate(cutoff.getDate() - 14);
      } else if (filterValue === '1m') {
        cutoff.setMonth(cutoff.getMonth() - 1);
      } else if (filterValue === '3m') {
        cutoff.setMonth(cutoff.getMonth() - 3);
      } else {
        cutoff.setDate(cutoff.getDate() - 14);
      }

      return cutoff.getTime();
    }

    function getAgeFilterLabel(filterValue = currentAgeFilter) {
      return ({
        '1w': '1 week',
        '2w': '2 weeks',
        '1m': '1 month',
        '3m': '3 months'
      })[filterValue] || '1 week';
    }

    // Prefer the session date encoded in filenames such as
    // Annotator_report_2026-08-21_100401.xlsx.
    // Fall back to Azure Last-Modified if no date exists in the name.
    function getSessionTimestampMs(blob) {
      const m = String(blob.name || '').match(/(\d{4}-\d{2}-\d{2})(?:[_T](\d{2})(\d{2})(\d{2})?)?/);
      if (m) {
        const hh = m[2] || '00';
        const mm = m[3] || '00';
        const ss = m[4] || '00';
        const parsed = Date.parse(`${m[1]}T${hh}:${mm}:${ss}`);
        if (!Number.isNaN(parsed)) return parsed;
      }
      return blob.lastModifiedMs || 0;
    }

    function formatDateTime(ms) {
      if (!ms) return 'Unknown';
      const d = new Date(ms);
      return d.toLocaleString();
    }

    // ==========================================================
    // DEVICE NAME CSV
    // ==========================================================

    async function loadDeviceMapping() {
      const map = new Map();

      try {
        const res = await fetch(nc(DEVICE_MAPPING_CSV), { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const text = await res.text();
        const wb = XLSX.read(text, { type: 'string' });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, { header: 1, blankrows: false });

        if (!rows.length) return map;

        const headers = rows[0].map(normalizeKey);
        let deviceIdx = headers.findIndex(h => ['deviceid', 'id', 'deviceidentifier'].includes(h));
        let nameIdx   = headers.findIndex(h => ['name', 'devicename', 'friendlyname', 'displayname'].includes(h));

        // If no recognized header exists, accept a simple 2-column CSV.
        let startRow = 1;
        if (deviceIdx < 0 || nameIdx < 0) {
          deviceIdx = 0;
          nameIdx = 1;
          startRow = 0;
        }

        for (let r = startRow; r < rows.length; r++) {
          const deviceId = String(rows[r]?.[deviceIdx] ?? '').trim();
          const friendly = String(rows[r]?.[nameIdx] ?? '').trim();
          if (deviceId && friendly) map.set(deviceId, friendly);
        }
      } catch (err) {
        console.warn('Could not load device mapping CSV:', err);
      }

      return map;
    }

    // ==========================================================
    // AZURE BLOB LISTING
    // ==========================================================

    async function listAllBlobs() {
      const all = [];
      let marker = '';

      do {
        let url = `${BASE_URL}?restype=container&comp=list&${SAS_TOKEN}`;
        if (marker) url += `&marker=${encodeURIComponent(marker)}`;

        const res = await fetch(nc(url), { cache: 'no-store' });
        if (!res.ok) throw new Error(`Azure list failed: HTTP ${res.status}`);

        const xml = await res.text();
        const doc = new DOMParser().parseFromString(xml, 'application/xml');

        const parserError = doc.querySelector('parsererror');
        if (parserError) throw new Error('Could not parse Azure blob list XML');

        for (const b of Array.from(doc.getElementsByTagName('Blob'))) {
          const name = b.getElementsByTagName('Name')[0]?.textContent || '';
          const lm = b.getElementsByTagName('Last-Modified')[0]?.textContent || '';
          all.push({ name, lastModifiedMs: Date.parse(lm) || 0 });
        }

        marker = doc.getElementsByTagName('NextMarker')[0]?.textContent || '';
      } while (marker);

      return all;
    }

    // ==========================================================
    // WORKBOOK EXTRACTION
    // ==========================================================

    function extractDeviceIdFromStatistics(wb) {
      const sheetName = wb.SheetNames.find(n => /statistics/i.test(n));
      if (!sheetName) return null;

      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], {
        header: 1,
        blankrows: false,
        defval: ''
      });

      const acceptedLabels = new Set([
        'deviceid',
        'deviceidentifier',
        'deviceidentifierid'
      ]);

      for (let r = 0; r < rows.length; r++) {
        const row = rows[r] || [];

        for (let c = 0; c < row.length; c++) {
          const normalized = normalizeKey(row[c]);
          if (!acceptedLabels.has(normalized)) continue;

          // Most likely layout: label in one cell, value directly to the right.
          for (let offset = 1; offset <= 3; offset++) {
            const candidate = String(row[c + offset] ?? '').trim();
            if (candidate) return candidate;
          }

          // Fallback: value directly below the label.
          const below = String(rows[r + 1]?.[c] ?? '').trim();
          if (below) return below;
        }
      }

      return null;
    }

    function extractValueFromSheetByLabel(wb, sheetRegex, acceptedLabels) {
      const sheetName = wb.SheetNames.find(n => sheetRegex.test(n));
      if (!sheetName) return null;

      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], {
        header: 1,
        blankrows: false,
        defval: ''
      });

      const labels = new Set(acceptedLabels.map(normalizeKey));
      for (let r = 0; r < rows.length; r++) {
        const row = rows[r] || [];
        for (let c = 0; c < row.length; c++) {
          if (!labels.has(normalizeKey(row[c]))) continue;

          for (let offset = 1; offset <= 3; offset++) {
            const candidate = String(row[c + offset] ?? '').trim();
            if (candidate) return candidate;
          }

          const below = String(rows[r + 1]?.[c] ?? '').trim();
          if (below) return below;
        }
      }
      return null;
    }

    function getLastCityFromValue(value) {
      const text = String(value ?? '').trim();
      if (!text) return null;

      // The Statistics sheet can store the driven city sequence in one cell,
      // e.g. "Santa Oliva - ... - Tarragona - el Catllar".
      // Only the final city is relevant for the device's latest location.
      const cities = text
        .split(/\s+-\s+/)
        .map(v => v.trim())
        .filter(Boolean);

      return cities.length ? cities[cities.length - 1] : text;
    }

    function extractCityFromStatistics(wb) {
      const sheetName = wb.SheetNames.find(n => /statistics/i.test(n));
      if (!sheetName) return null;

      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], {
        header: 1,
        blankrows: false,
        defval: ''
      });

      // There can be more than one City/Cities entry. Use the LAST one in the sheet.
      // If its value contains a city history separated by " - ", use only the last city.
      for (let r = rows.length - 1; r >= 0; r--) {
        const row = rows[r] || [];
        for (let c = row.length - 1; c >= 0; c--) {
          const cityKey = normalizeKey(row[c]);
          if (cityKey !== 'city' && cityKey !== 'cities') continue;

          for (let offset = 1; offset <= 3; offset++) {
            const candidate = String(row[c + offset] ?? '').trim();
            if (candidate) return getLastCityFromValue(candidate);
          }

          const below = String(rows[r + 1]?.[c] ?? '').trim();
          if (below) return getLastCityFromValue(below);
        }
      }
      return null;
    }

    function extractStatisticsSummary(wb) {
      return {
        totalTestTime: extractValueFromSheetByLabel(
          wb,
          /statistics/i,
          ['Total test time', 'Test time', 'Total time']
        ),
        totalTestDistance: extractValueFromSheetByLabel(
          wb,
          /statistics/i,
          ['Total test distance', 'Test distance', 'Total distance']
        )
      };
    }

    function buildStreetViewUrl(lat, lon) {
      // Google Street View embed centered on the latest GPS position.
      // This no-key embed format opens Street View when imagery is available.
      const ll = `${Number(lat).toFixed(6)},${Number(lon).toFixed(6)}`;
      return `https://www.google.com/maps?layer=c&cbll=${encodeURIComponent(ll)}&cbp=11,0,0,0,0&output=svembed`;
    }

    function buildStreetViewOpenUrl(lat, lon) {
      const ll = `${Number(lat).toFixed(6)},${Number(lon).toFixed(6)}`;
      return `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${encodeURIComponent(ll)}`;
    }

    function extractTestDetails(wb) {
      const details = {};
      const sheetName = wb.SheetNames.find(n => /test\s*details/i.test(n));
      if (!sheetName) return details;

      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], {
        header: 1,
        blankrows: false,
        defval: ''
      });

      for (const row of rows) {
        if (!row || row.length < 2) continue;
        const key = String(row[0] ?? '').trim().toLowerCase();
        const value = String(row[1] ?? '').trim();
        if (key && value) details[key] = value;
      }
      return details;
    }

    function findColumn(headers, patterns) {
      return headers.findIndex(header => patterns.some(p => p.test(header)));
    }

    function parseSamplingTimestamp(raw) {
      if (raw instanceof Date) return raw.getTime();
      if (typeof raw === 'number' && Number.isFinite(raw)) {
        const parsed = XLSX.SSF.parse_date_code(raw);
        if (parsed) {
          return new Date(parsed.y, parsed.m - 1, parsed.d, parsed.H || 0, parsed.M || 0, parsed.S || 0).getTime();
        }
      }
      const parsed = Date.parse(String(raw || ''));
      return Number.isNaN(parsed) ? null : parsed;
    }

    function extractLatestGpsFromSampling(wb) {
      const sheetName = wb.SheetNames.find(n => /^sampling$/i.test(n.trim())) ||
                        wb.SheetNames.find(n => /sampling/i.test(n));
      if (!sheetName) return null;

      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], {
        header: 1, blankrows: false, defval: ''
      });
      if (rows.length < 2) return null;

      const headers = rows[0].map(v => String(v ?? '').trim().toLowerCase());
      const latIdx = findColumn(headers, [/^lat$/, /latitude/, /gps.*lat/, /lat.*gps/]);
      const lonIdx = findColumn(headers, [/^lon$/, /^lng$/, /^long$/, /longitude/, /gps.*lon/, /lon.*gps/]);
      const timeIdx = findColumn(headers, [/^timestamp$/, /^time$/, /sampling.*time/, /timestamp/, /datetime/, /date.*time/]);
      const countryIdx = findColumn(headers, [/^country$/, /country/]);
      if (latIdx < 0 || lonIdx < 0) return null;

      const validPoints = [];
      for (let r = 1; r < rows.length; r++) {
        const lat = parseFloat(String(rows[r][latIdx]).replace(',', '.'));
        const lon = parseFloat(String(rows[r][lonIdx]).replace(',', '.'));
        if (!isValidCoordinate(lat, lon)) continue;
        validPoints.push({
          lat, lon,
          timestamp: timeIdx >= 0 ? parseSamplingTimestamp(rows[r][timeIdx]) : null,
          country: countryIdx >= 0 ? String(rows[r][countryIdx] ?? '').trim() : ''
        });
      }
      if (!validPoints.length) return null;

      const latest = validPoints[validPoints.length - 1];
      let trace = [];
      if (latest.timestamp) {
        const cutoff = latest.timestamp - 2 * 60 * 1000;
        trace = validPoints.filter(p => p.timestamp && p.timestamp >= cutoff);
      }
      if (!trace.length) trace = validPoints.slice(-30);
      if (trace.length > 30) trace = trace.slice(-30);

      return {
        lat: latest.lat,
        lon: latest.lon,
        coordinateTimestamp: latest.timestamp,
        country: latest.country || null,
        trace
      };
    }

    function calculateBearing(lat1, lon1, lat2, lon2) {
      const toRad = deg => deg * Math.PI / 180;
      const toDeg = rad => rad * 180 / Math.PI;
      const phi1 = toRad(lat1);
      const phi2 = toRad(lat2);
      const dLon = toRad(lon2 - lon1);
      const y = Math.sin(dLon) * Math.cos(phi2);
      const x = Math.cos(phi1) * Math.sin(phi2) - Math.sin(phi1) * Math.cos(phi2) * Math.cos(dLon);
      return (toDeg(Math.atan2(y, x)) + 360) % 360;
    }

    function getTraceBearing(trace) {
      if (!Array.isArray(trace) || trace.length < 2) return 0;
      const last = trace[trace.length - 1];
      for (let i = trace.length - 2; i >= 0; i--) {
        const prev = trace[i];
        if (Math.abs(last.lat - prev.lat) > 0.000001 || Math.abs(last.lon - prev.lon) > 0.000001) {
          return calculateBearing(prev.lat, prev.lon, last.lat, last.lon);
        }
      }
      return 0;
    }

    async function readWorkbookInfo(blob) {
      const cached = fileCache.get(blob.name);
      if (cached && cached.lastModifiedMs === blob.lastModifiedMs) return cached;

      const url = `${BASE_URL}/${encodeURIComponent(blob.name)}?${SAS_TOKEN}`;
      const res = await fetch(nc(url), { cache: 'no-store' });
      if (!res.ok) throw new Error(`${blob.name}: HTTP ${res.status}`);

      const buffer = await res.arrayBuffer();
      const wb = XLSX.read(new Uint8Array(buffer), { type: 'array', cellDates: true });

      const deviceId = extractDeviceIdFromStatistics(wb);
      const city = extractCityFromStatistics(wb);
      const details = extractTestDetails(wb);
      const stats = extractStatisticsSummary(wb);
      const gps = extractLatestGpsFromSampling(wb);

      const testPurpose =
        details['purpose'] ||
        details['test purpose'] ||
        null;

      const participants =
        details['participants'] ||
        details['participant'] ||
        null;

      const info = {
        filename: blob.name,
        lastModifiedMs: blob.lastModifiedMs,
        sessionTimestampMs: getSessionTimestampMs(blob),
        deviceId,
        city,
        country: gps?.country ?? null,
        trace: gps?.trace ?? [],
        testPurpose,
        participants,
        totalTestTime: stats.totalTestTime || null,
        totalTestDistance: stats.totalTestDistance || null,
        lat: gps?.lat ?? null,
        lon: gps?.lon ?? null,
        coordinateTimestamp: gps?.coordinateTimestamp ?? null
      };

      fileCache.set(blob.name, info);
      return info;
    }

    // ==========================================================
    // MAP RENDERING
    // ==========================================================

    function chooseLatestPerDevice(records) {
      const latest = new Map();

      for (const record of records) {
        if (!record.deviceId || !isValidCoordinate(record.lat, record.lon)) continue;

        const effectiveTime = record.coordinateTimestamp || record.sessionTimestampMs || record.lastModifiedMs || 0;
        const previous = latest.get(record.deviceId);
        const previousTime = previous
          ? (previous.coordinateTimestamp || previous.sessionTimestampMs || previous.lastModifiedMs || 0)
          : -Infinity;

        if (!previous || effectiveTime > previousTime) {
          latest.set(record.deviceId, record);
        }
      }

      return Array.from(latest.values());
    }

    function getEffectiveSeenTime(record) {
      return record.coordinateTimestamp || record.sessionTimestampMs || record.lastModifiedMs || 0;
    }

    function getDeviceStatus(record) {
      const seen = getEffectiveSeenTime(record);
      if (!seen) return { label: 'No GPS', className: 'status-nogps' };

      const ageMs = Date.now() - seen;
      if (ageMs <= 15 * 60 * 1000) return { label: 'Active', className: 'status-active' };
      if (ageMs <= 24 * 60 * 60 * 1000) return { label: 'Recent', className: 'status-recent' };
      return { label: 'Offline', className: 'status-offline' };
    }

    function formatAge(ms) {
      if (!ms) return 'Unknown';
      const diff = Math.max(0, Date.now() - ms);
      const min = Math.floor(diff / 60000);
      if (min < 1) return 'Now';
      if (min < 60) return `${min} min ago`;
      const hours = Math.floor(min / 60);
      if (hours < 24) return `${hours} h ago`;
      const days = Math.floor(hours / 24);
      return `${days} d ago`;
    }

    function selectDevice(deviceId, panToMarker = false) {
      selectedDeviceId = deviceId;

      document.querySelectorAll('#device-table tbody tr').forEach(tr => {
        tr.classList.toggle('selected', tr.dataset.deviceId === deviceId);
      });

      const marker = markersByDevice.get(deviceId);
      if (marker && panToMarker) {
        map.setView(marker.getLatLng(), Math.max(map.getZoom(), 13));
        marker.openPopup();
      }
    }

    function renderDeviceTable(records, deviceNames) {
      const tbody = document.querySelector('#device-table tbody');
      const summary = document.getElementById('device-summary');
      tbody.innerHTML = '';

      const sorted = [...records].sort((a, b) => getEffectiveSeenTime(b) - getEffectiveSeenTime(a));
      const counts = { Active: 0, Recent: 0, Offline: 0, 'No GPS': 0 };

      for (const record of sorted) {
        const friendlyName = deviceNames.get(record.deviceId) || 'Unregistered device';
        const status = getDeviceStatus(record);
        counts[status.label] = (counts[status.label] || 0) + 1;

        const tr = document.createElement('tr');
        tr.dataset.deviceId = record.deviceId;
        if (selectedDeviceId === record.deviceId) tr.classList.add('selected');

        const values = [
          friendlyName,
          null,
          formatAge(getEffectiveSeenTime(record)),
          [record.city, record.country].filter(Boolean).join(' / ') || '—',
          record.testPurpose || '—',
          record.participants || '—'
        ];

        values.forEach((value, index) => {
          const td = document.createElement('td');
          if (index === 1) {
            const pill = document.createElement('span');
            pill.className = `status-pill ${status.className}`;
            pill.textContent = status.label;
            td.appendChild(pill);
          } else {
            td.textContent = value;
            if (value === '—') td.classList.add('muted');
          }
          tr.appendChild(td);
        });

        tr.title = `${friendlyName}\nLast seen: ${formatDateTime(getEffectiveSeenTime(record))}`;
        tr.addEventListener('click', () => selectDevice(record.deviceId, true));
        tbody.appendChild(tr);
      }

      summary.textContent =
        `Devices: ${sorted.length} · Active: ${counts.Active} · Recent: ${counts.Recent} · Offline: ${counts.Offline}`;
    }

    function renderDevices(records, deviceNames) {
      markerLayer.clearLayers();
      markersByDevice.clear();
      const bounds = [];

      for (const record of records) {
        const friendlyName = deviceNames.get(record.deviceId) || 'Unregistered device';
        const status = getDeviceStatus(record);
        const locationText = [record.city, record.country].filter(Boolean).join(' / ') || 'Unknown';
        let marker;

        if (status.label === 'Active') {
          const traceLatLngs = (record.trace || [])
            .filter(p => isValidCoordinate(p.lat, p.lon))
            .map(p => [p.lat, p.lon]);

          if (traceLatLngs.length >= 2) {
            L.polyline(traceLatLngs, {
              weight: 5, opacity: 0.65, lineCap: 'round', lineJoin: 'round'
            }).addTo(markerLayer);

            traceLatLngs.slice(0, -1).forEach((ll, index) => {
              const opacity = 0.18 + 0.55 * ((index + 1) / traceLatLngs.length);
              L.circleMarker(ll, { radius: 3, weight: 0, fillOpacity: opacity }).addTo(markerLayer);
            });
          }

          const bearing = getTraceBearing(record.trace || []);
          const arrowIcon = L.divIcon({
            className: '',
            html: `<div class="active-direction-marker"><div class="active-direction-arrow" style="transform:rotate(${bearing}deg)"></div></div>`,
            iconSize: [34, 34],
            iconAnchor: [17, 17]
          });
          marker = L.marker([record.lat, record.lon], { icon: arrowIcon, zIndexOffset: 1000 });
        } else {
          marker = L.marker([record.lat, record.lon]);
        }

        marker.bindTooltip(escapeHtml(friendlyName), {
          permanent: true, direction: 'top', offset: [0, -10], className: 'device-label'
        });

        const streetViewUrl = buildStreetViewUrl(record.lat, record.lon);
        const streetViewOpenUrl = buildStreetViewOpenUrl(record.lat, record.lon);

        marker.bindPopup(`
          <div class="device-popup">
            <strong>${escapeHtml(friendlyName)}</strong><br>
            Status: ${escapeHtml(status.label)}<br>
            Location: ${escapeHtml(locationText)}<br>
            Test purpose: ${escapeHtml(record.testPurpose || 'Unknown')}<br>
            Participants: ${escapeHtml(record.participants || 'Unknown')}<br>
            Total test time: ${escapeHtml(record.totalTestTime || 'Unknown')}<br>
            Total test distance: ${escapeHtml(record.totalTestDistance || 'Unknown')}<br>
            Position: ${record.lat.toFixed(6)}, ${record.lon.toFixed(6)}<br>
            GPS time: ${escapeHtml(formatDateTime(getEffectiveSeenTime(record)))}
            <div class="streetview-wrap">
              <div class="streetview-title">Street View</div>
              <iframe
                class="streetview-frame"
                src="${escapeHtml(streetViewUrl)}"
                loading="lazy"
                referrerpolicy="no-referrer-when-downgrade"
                title="Street View at ${escapeHtml(friendlyName)}">
              </iframe>
              <a class="streetview-link" href="${escapeHtml(streetViewOpenUrl)}" target="_blank" rel="noopener noreferrer">Open Street View</a>
            </div>
          </div>
        `, { maxWidth: 380, minWidth: 320 });

        marker.on('click', () => selectDevice(record.deviceId, false));
        marker.addTo(markerLayer);
        markersByDevice.set(record.deviceId, marker);
        bounds.push([record.lat, record.lon]);
      }

      renderDeviceTable(records, deviceNames);

      if (firstSuccessfulRender && bounds.length) {
        if (bounds.length === 1) map.setView(bounds[0], 13);
        else map.fitBounds(bounds, { padding: [40, 40], maxZoom: 14 });
        firstSuccessfulRender = false;
      }

      setTimeout(() => map.invalidateSize(), 0);
    }

    // ==========================================================
    // REFRESH LOOP
    // ==========================================================

    async function refresh() {
      if (refreshInProgress) return;
      refreshInProgress = true;

      const refreshButton = document.getElementById('refresh-now');
      if (refreshButton) {
        refreshButton.disabled = true;
        refreshButton.textContent = 'Refreshing…';
      }

      try {
        setStatus('Scanning Azure…');

        const [deviceNames, blobs] = await Promise.all([
          loadDeviceMapping(),
          listAllBlobs()
        ]);

        const cutoffMs = getAgeCutoffMs();
        const recentExcel = blobs
          .filter(b => /\.xlsx$/i.test(b.name))
          .filter(b => getSessionTimestampMs(b) >= cutoffMs)
          .sort((a, b) => getSessionTimestampMs(b) - getSessionTimestampMs(a));

        if (!recentExcel.length) {
          markerLayer.clearLayers();
          markersByDevice.clear();
          document.querySelector('#device-table tbody').innerHTML = '';
          document.getElementById('device-summary').textContent = 'No devices found for the selected period.';
          hideReadProgress();
          setStatus(`No Excel sessions found from the latest ${getAgeFilterLabel()}.`);
          return;
        }

        const results = [];
        const CONCURRENCY = 4;
        let nextIndex = 0;
        let completedCount = 0;
        setReadProgress(0, recentExcel.length);

        async function worker() {
          while (true) {
            const index = nextIndex++;
            if (index >= recentExcel.length) break;

            const blob = recentExcel[index];
            try {
              const info = await readWorkbookInfo(blob);
              results.push(info);
            } catch (err) {
              console.warn('Workbook read failed:', blob.name, err);
            } finally {
              completedCount++;
              setReadProgress(completedCount, recentExcel.length);
            }
          }
        }

        await Promise.all(Array.from({ length: Math.min(CONCURRENCY, recentExcel.length) }, worker));

        hideReadProgress();

        const latestDevices = chooseLatestPerDevice(results);
        renderDevices(latestDevices, deviceNames);

        const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        setStatus(`${latestDevices.length} device(s) shown · ${recentExcel.length} sessions checked · Updated ${now}`);
      } catch (err) {
        hideReadProgress();
        console.error(err);
        setStatus(`Update failed: ${err.message || err}`, true);
      } finally {
        refreshInProgress = false;
        if (refreshButton) {
          refreshButton.disabled = false;
          refreshButton.textContent = 'Refresh now';
        }
      }
    }

    const ageFilterSelect = document.getElementById('age-filter');
    if (ageFilterSelect) {
      ageFilterSelect.value = DEFAULT_AGE_FILTER;
      currentAgeFilter = ageFilterSelect.value;
      ageFilterSelect.addEventListener('change', () => {
        currentAgeFilter = ageFilterSelect.value || DEFAULT_AGE_FILTER;
        refresh();
      });
    }

    document.getElementById('refresh-now')?.addEventListener('click', () => refresh());

    refresh();
    setInterval(refresh, REFRESH_INTERVAL_MS);
  </script>
</body>
