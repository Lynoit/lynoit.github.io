<html lang="sv">
<head>

  <style>

    :root{
      --wall:#dfd6c9;
      --frame-a:#be8b55;
      --frame-b:#9c673b;
      --frame-c:#845328;
      --cork-a:#d2a06b;
      --cork-b:#bf8752;
      --cork-c:#b57b47;
      --paper:#ecd9b3;

      --ink:#5a4738;

    *{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  padding:0;
  color:var(--ink);
  font-family:var(--serif);
  background:#000;
}

.frame{
  min-height:100vh;
  padding:16px;
  border-radius:0;
  display:flex;
  flex-direction:column;
  background:
    linear-gradient(180deg, rgba(255,255,255,.06), rgba(0,0,0,.12)),
    url("wood.jpg");
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  box-shadow:none;
}

.board{
  min-height:calc(100vh - 32px);
  padding:20px 18px 14px;
  border-radius:18px;
  position:relative;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  background:
    linear-gradient(180deg, rgba(255,255,255,.05), rgba(0,0,0,.08)),
    url("cork.jpg");
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  box-shadow:
    inset 0 0 0 2px rgba(255,255,255,.07),
    inset 0 18px 40px rgba(255,255,255,.05),
    inset 0 -18px 28px rgba(91,56,27,.07);
}

    .top{
      display:grid;
      grid-template-columns:210px 1fr 200px;
      gap:18px;
      align-items:start;
      margin-bottom:18px;
      position:relative;
      z-index:1;
    }

.pin-note,.qr-note{
  background:
    linear-gradient(180deg, rgba(255,255,255,.45) 0%, rgba(255,255,255,.16) 18%, rgba(0,0,0,.03) 100%),
    linear-gradient(135deg, #f3e3c7 0%, #ead6b1 55%, #dcc397 100%);
  border:2px solid rgba(40,28,18,.55);
  border-radius:6px;
  box-shadow:
    0 2px 3px rgba(0,0,0,.10),
    0 8px 14px rgba(0,0,0,.16),
    0 18px 26px rgba(0,0,0,.18),
    0 1px 0 rgba(255,255,255,.55) inset,
    0 -10px 18px rgba(90,60,30,.06) inset,
    -8px 0 14px rgba(255,255,255,.05) inset,
    8px 0 14px rgba(0,0,0,.04) inset;
  font-family:var(--sans);
  position:relative;
  min-height:auto;
}

    .pin-note:before,.qr-note:before{
      content:"";
      position:absolute;
      top:-14px;
      left:50%;
      transform:translateX(-50%);
      width:18px;
      height:18px;
      border-radius:50%;
      background:
        radial-gradient(circle at 35% 32%, rgba(255,255,255,.95) 0 2px, rgba(255,255,255,.55) 2px 4px, transparent 4px),
        radial-gradient(circle at 50% 52%, #f4ead9 0 5px, #d8c2a7 5px 7px, #8c6b4f 7px 9px);
      box-shadow:
        0 2px 3px rgba(0,0,0,.28),
        inset 0 -1px 2px rgba(0,0,0,.18);
      z-index:3;
    }

    .pin-note:after,
.qr-note:after,
.name:after,
.card:after{
  content:"";
  position:absolute;
  left:50%;
  top:0px;
  transform:translateX(-50%);
  width:2px;
  height:18px;
  border-radius:2px;
  background:linear-gradient(180deg, #d8d8d8 0%, #b7b7b7 35%, #7f7f7f 100%);
  box-shadow:
    0 1px 2px rgba(0,0,0,.20),
    1px 0 0 rgba(255,255,255,.20);
  z-index:2;
}    

  .name:after{

  height:16px;
}
    
.pin-note{
  width:75%;
  margin:8px auto 0;
  padding:12px;
  transform:rotate(-1.2deg);
  display:flex;
  align-items:center;
  justify-content:center;
}

    .pin-note button{

      border:none;
      border-radius:10px;

      font-size:1rem;
      font-weight:700;

/* =========================================================
   Raspberry Pi: rotera hela dashboarden 90 grader åt höger
   ========================================================= */

html.raspberry-pi,
html.raspberry-pi body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:#000;
}

/*
 * När Raspberry Pi detekteras byter vi plats på viewportens
 * bredd och höjd och roterar hela sidans innehåll.
 */
html.raspberry-pi body{
  position:fixed;

  width:100vh;
  height:100vw;

  min-width:100vh;
  min-height:100vw;

  left:100vw;
  top:0;

  transform-origin:top left;
  transform:rotate(90deg);
}

/*
 * Eftersom den logiska viewporten nu är roterad måste frame
 * använda den nya bredden/höjden i stället för vanlig 100vh.
 */
html.raspberry-pi .frame{
  width:100vh;
  min-width:100vh;

  height:100vw;
  min-height:100vw;
}

/*
 * Board ska fylla den roterade viewporten.
 */
html.raspberry-pi .board{
  width:calc(100vh - 32px);
  min-width:calc(100vh - 32px);

  height:calc(100vw - 32px);
  min-height:calc(100vw - 32px);
}

/*
 * =========================================================
 * Raspberry Pi detection + screen rotation
 * =========================================================
 */

function isRaspberryPi() {
  const params =
    new URLSearchParams(window.location.search);

  if (params.get('raspberrypi') === '1') {
    return true;
  }

  const userAgent =
    (navigator.userAgent || '').toLowerCase();

  const platform =
    (navigator.platform || '').toLowerCase();

  const isLinux =
    userAgent.includes('linux') ||
    platform.includes('linux');

  const isArm =
    userAgent.includes('arm') ||
    userAgent.includes('aarch64') ||
    platform.includes('arm') ||
    platform.includes('aarch64');

  return isLinux && isArm;
}

function configureDisplayForHardware() {
  const raspberryPi = isRaspberryPi();

  if (raspberryPi) {
    document.documentElement.classList.add(
      'raspberry-pi'
    );

    console.log(
      'Raspberry Pi/ARM Linux detected – dashboard rotated 90°.'
    );
  } else {
    document.documentElement.classList.remove(
      'raspberry-pi'
    );

    console.log(
      'Non-Raspberry Pi device – normal dashboard orientation.'
    );
  }
}

    function buildQrCode() {
      const qrWrap = document.getElementById('qrcode');
      const encodedUrl = encodeURIComponent(activityAppUrl);
      const qrImageUrl = `https://api.qrserver.com/v1/create-qr-code/?size=140x140&margin=0&data=${encodedUrl}`;
      qrWrap.innerHTML = `<img src="${qrImageUrl}" alt="QR-kod till aktivitetshanteraren" referrerpolicy="no-referrer">`;
    }

    function formatTime(isoString) {
      if (!isoString) return '-';
      return new Date(isoString).toLocaleString('sv-SE', {
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    function getBlobBaseUrl() {
      return `https://${azureConfig.accountName}.blob.core.windows.net/${azureConfig.containerName}`;
    }

async function listJsonBlobs() {
  const { accountName, containerName, sasToken } = azureConfig;
  if (!accountName || !containerName || !sasToken || sasToken.includes('PASTA_IN')) {
    throw new Error('Azure-inställningar saknas. Lägg in en giltig SAS-token i dashboardfilen.');
  }

  const query = sasToken.replace(/^\?/, '');
  const url = `https://${accountName}.blob.core.windows.net/${containerName}?restype=container&comp=list&include=metadata&${query}`;
  const response = await fetch(url);
  if (!response.ok) throw new Error(`Kunde inte läsa från Azure (${response.status}).`);

  const xml = await response.text();
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  const blobNodes = Array.from(doc.querySelectorAll('Blob'));

  return blobNodes
    .map(blob => {
      const name = blob.querySelector('Name')?.textContent || '';
      const lastModified = blob.querySelector('Properties > Last-Modified')?.textContent || '';
      return { name, lastModified };
    })
    .filter(blob => blob.name.endsWith('.json'));
}

    async function readJsonRecord(fileName) {
      const query = azureConfig.sasToken.replace(/^\?/, '');
      const url = `${getBlobBaseUrl()}/${encodeURIComponent(fileName)}?${query}`;
      const response = await fetch(url);
      if (!response.ok) throw new Error(`Kunde inte läsa ${fileName}`);
      return response.json();
    }

function isNightMode() {
  const hour = new Date().getHours();
  return hour >= 23 || hour < 9;
}

function updateNightMode() {
  const night = isNightMode();
  nightScreen.style.display = night ? 'block' : 'none';
}

async function safeLoadActivities() {
  if (isNightMode()) {
    updateNightMode();
    return;
  }

  updateNightMode();

  try {
    await loadActivities();
  } catch (error) {
    console.error(error);
    if (pollStatus) pollStatus.textContent = '';
  }
}

function startPolling() {
  if (pollTimer) clearInterval(pollTimer);

  pollTimer = setInterval(() => {
    safeLoadActivities();
  }, pollIntervalMs);
}    

async function loadActivities(force = false) {
  if (pollStatus) pollStatus.textContent = '';

  const files = await listJsonBlobs();

  const sortedFiles = files
    .slice()
    .sort((a, b) =>
      a.name.localeCompare(b.name)
    )
    .reverse();

  /*
   * Signaturen innehåller ALLA JSON-filer.
   *
   * Därmed märker dashboarden:
   * - ny aktivitet
   * - borttagen aktivitet
   * - ändrad aktivitet
   * - nytt/borttaget kalenderevent
   */
  const fileSignature = sortedFiles
    .map(file =>
      `${file.name}:${file.lastModified}`
    )
    .join('|');

  if (
    !force &&
    hasLoadedOnce &&
    fileSignature === lastSeenFileSignature
  ) {
    return;
  }

  lastSeenFileSignature = fileSignature;
  hasLoadedOnce = true;

  /*
   * Läs alla JSON-poster.
   *
   * Det behövs för kalendern eftersom ett framtida event
   * kan ha skapats för länge sedan.
   */
  const allFiles =
    sortedFiles.map(file => file.name);

  const records = await Promise.all(
    allFiles.map(readJsonRecord)
  );

  /*
   * --------------------------------
   * KALENDER
   * --------------------------------
   */

  const calendarEvents = records
    .filter(record =>
      record &&
      record.activity === 'Kalenderevent' &&
      record.eventDate
    );

  renderCalendar(calendarEvents);

  /*
   * --------------------------------
   * VANLIGA AKTIVITETER
   * --------------------------------
   */

  const cutoff =
    Date.now() -
    (14 * 24 * 60 * 60 * 1000);

  const byUser = Object.fromEntries(
    users.map(user => [user.name, []])
  );

  records
    .filter(record =>
      record &&
      record.member &&
      record.timestamp
    )

    .filter(record => {
      const ts =
        new Date(record.timestamp).getTime();

      return (
        Number.isFinite(ts) &&
        ts >= cutoff
      );
    })

    /*
     * Kalenderevent ska INTE visas
     * som vanliga aktivitetskort.
     */
    .filter(record =>
      record.activity !== 'Kalenderevent'
    )

    .filter(record =>
      !hiddenActivities.includes(
        record.activity
      )
    )

    .sort(
      (a, b) =>
        new Date(b.timestamp) -
        new Date(a.timestamp)
    )

    .forEach(record => {
      if (!byUser[record.member]) return;

      if (
        record.member === 'Lerverkstan' ||
        byUser[record.member].length < 4
      ) {
        byUser[record.member].push(record);
      }
    });

  renderRows(byUser);

  if (pollStatus) {
    pollStatus.textContent = '';
  }
}

function renderCalendar(events) {
  if (!calendarPanel || !calendarGrid || !calendarTitle) return;

  const validEvents = events
    .filter(event =>
      event &&
      event.activity === 'Kalenderevent' &&
      event.eventDate
    )
    .sort((a, b) =>
      a.eventDate.localeCompare(b.eventDate)
    );

  if (!validEvents.length) {
    calendarPanel.classList.add('no-events');
    calendarGrid.innerHTML = '';
    return;
  }

  calendarPanel.classList.remove('no-events');

  const today = new Date();

  /*
   * Normalt visar vi innevarande månad.
   *
   * Om det inte finns några event denna månad väljer vi
   * månaden för närmaste kommande event.
   */
  let displayYear = today.getFullYear();
  let displayMonth = today.getMonth();

  const eventsThisMonth = validEvents.filter(event => {
    const [year, month] = event.eventDate
      .split('-')
      .map(Number);

    return (
      year === displayYear &&
      month - 1 === displayMonth
    );
  });

  if (!eventsThisMonth.length) {
    const todayString = [
      today.getFullYear(),
      String(today.getMonth() + 1).padStart(2, '0'),
      String(today.getDate()).padStart(2, '0')
    ].join('-');

    const nextEvent =
      validEvents.find(event =>
        event.eventDate >= todayString
      ) || validEvents[0];

    const [year, month] = nextEvent.eventDate
      .split('-')
      .map(Number);

    displayYear = year;
    displayMonth = month - 1;
  }

  const monthName = new Intl.DateTimeFormat(
    'sv-SE',
    {
      month: 'long',
      year: 'numeric'
    }
  ).format(
    new Date(displayYear, displayMonth, 1)
  );

  calendarTitle.textContent =
    monthName.charAt(0).toUpperCase() +
    monthName.slice(1);

  calendarGrid.innerHTML = '';

  /*
   * JS:
   * söndag = 0
   * måndag = 1
   *
   * Vi gör måndag till kalenderns första dag.
   */
  const firstDay = new Date(
    displayYear,
    displayMonth,
    1
  );

  const mondayIndex =
    (firstDay.getDay() + 6) % 7;

  /*
   * Visa alltid 6 veckor.
   * Det gör att kalenderns storlek inte hoppar mellan månader.
   */
  const calendarStart = new Date(
    displayYear,
    displayMonth,
    1 - mondayIndex
  );

  for (let i = 0; i < 42; i++) {
    const currentDate = new Date(calendarStart);
    currentDate.setDate(
      calendarStart.getDate() + i
    );

    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();
    const day = currentDate.getDate();

    const dateString = [
      year,
      String(month + 1).padStart(2, '0'),
      String(day).padStart(2, '0')
    ].join('-');

    const dayElement =
      document.createElement('div');

    dayElement.className = 'calendar-day';

    if (month !== displayMonth) {
      dayElement.classList.add('other-month');
    }

    const isToday =
      year === today.getFullYear() &&
      month === today.getMonth() &&
      day === today.getDate();

    if (isToday) {
      dayElement.classList.add('today');
    }

    const dateElement =
      document.createElement('div');

    dateElement.className = 'calendar-date';
    dateElement.textContent = day;

    dayElement.appendChild(dateElement);

    const todaysEvents =
      validEvents.filter(event =>
        event.eventDate === dateString
      );

    todaysEvents.forEach(event => {
      const eventElement =
        document.createElement('div');

      eventElement.className = 'calendar-event';

      eventElement.textContent =
        event.eventDescription ||
        'Kalenderevent';

      dayElement.appendChild(eventElement);
    });

    calendarGrid.appendChild(dayElement);
  }
}    
    function renderRows(byUser) {
      const query = azureConfig.sasToken.replace(/^\?/, '');
      const baseUrl = getBlobBaseUrl();
      rowsContainer.innerHTML = '';

      users.forEach(user => {
        const activities = byUser[user.name] || [];
        if (!activities.length) return;

const row = document.createElement('section');
row.className = user.featured ? 'user-row featured-row' : 'user-row';

const nameTag = document.createElement('div');
nameTag.className = user.featured ? 'name featured-name' : 'name';
        nameTag.textContent = user.name;

const lane = document.createElement('div');
lane.className = user.featured
  ? `lane ${user.laneClass} featured-lane`
  : `lane ${user.laneClass}`;

const visibleActivities = user.name === 'Lerverkstan'
  ? activities
  : activities.slice(0, 4);

visibleActivities.forEach(activity => {
  const card = document.createElement('article');
  card.className = 'card';
  const imageHtml = activity.hasImage && activity.imageFileName
    ? `<img class="thumb" src="${baseUrl}/${encodeURIComponent(activity.imageFileName)}?${query}" alt="Bild för ${activity.activity}">`
    : '';
  card.innerHTML = `
    <div class="title2">${activity.activity || 'Okänd aktivitet'}</div>
    <div class="meta">${formatTime(activity.timestamp)}</div>
    ${imageHtml}
  `;
  lane.appendChild(card);
});

        row.appendChild(nameTag);
        row.appendChild(lane);
        rowsContainer.appendChild(row);
      });
    }

function updateFullscreenCardVisibility() {
  const fullscreenCard = document.querySelector('.pin-note');
  if (!fullscreenCard) return;

  const isFullscreen =
    Boolean(document.fullscreenElement) ||
    window.matchMedia('(display-mode: fullscreen)').matches;

  fullscreenCard.style.visibility = isFullscreen ? 'hidden' : '';
  fullscreenCard.style.pointerEvents = isFullscreen ? 'none' : '';
}

document.addEventListener(
  'fullscreenchange',
  updateFullscreenCardVisibility
);

window.addEventListener(
  'load',
  updateFullscreenCardVisibility
);

document.getElementById('fullscreen-btn').addEventListener('click', async () => {
  try {
    if (!document.fullscreenElement) {
      await document.documentElement.requestFullscreen();
    } else {
      await document.exitFullscreen();
    }

    updateFullscreenCardVisibility();
  } catch (error) {
    console.error(error);
    if (pollStatus) pollStatus.textContent = '';
  }
});

buildQrCode();
updateNightMode();

if (!isNightMode()) {
  safeLoadActivities();
} else {
  renderRows({});
}

function scheduleDailyCodeReload() {
  const reloadAfter = 24 * 60 * 60 * 1000;

  setTimeout(() => {
    const url = new URL(window.location.href);

    // Forces the browser/CDN to request the newest HTML.
    url.searchParams.set('_refresh', Date.now());

    // Avoids adding a new browser-history entry each day.
    window.location.replace(url.toString());
  }, reloadAfter);
}

scheduleDailyCodeReload();

startPolling();
  </script>
