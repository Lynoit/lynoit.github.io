<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skröja Anslagstavla</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Allura&display=swap');
    :root{
      --wall:#dfd6c9;
      --frame-a:#be8b55;
      --frame-b:#9c673b;
      --frame-c:#845328;
      --cork-a:#d2a06b;
      --cork-b:#bf8752;
      --cork-c:#b57b47;
      --paper:#ecd9b3;
      --paper-2:#d7bd8d;
      --ink:#5a4738;
      --blue:#98b8c6;
      --peach:#dda286;
      --green:#b5c171;
      --shadow:0 18px 36px rgba(70,48,22,.22);
      --soft:0 8px 16px rgba(70,48,22,.12);
      --sans:"Trebuchet MS", Arial, sans-serif;
      --serif:Georgia, "Times New Roman", serif;
    }

    *{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  padding:0;
  color:var(--ink);
  font-family:var(--serif);
  background:#000;
}

.frame{
  min-height:100vh;
  padding:16px;
  border-radius:0;
  display:flex;
  flex-direction:column;
  background:
    linear-gradient(180deg, rgba(255,255,255,.06), rgba(0,0,0,.12)),
    url("wood.jpg");
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  box-shadow:none;
}

.board{
  min-height:calc(100vh - 32px);
  padding:20px 18px 2px;

  border-radius:18px;
  position:relative;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  background:
    linear-gradient(180deg, rgba(255,255,255,.05), rgba(0,0,0,.08)),
    url("cork.jpg");
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  box-shadow:
    inset 0 0 0 2px rgba(255,255,255,.07),
    inset 0 18px 40px rgba(255,255,255,.05),
    inset 0 -18px 28px rgba(91,56,27,.07);
}

.top{
  display:grid;
  grid-template-columns:210px 1fr 200px;
  gap:18px;
  align-items:start;
  margin-bottom:42px;
  position:relative;
  z-index:1;
}

.pin-note,.qr-note{
  background:
    linear-gradient(180deg, rgba(255,255,255,.45) 0%, rgba(255,255,255,.16) 18%, rgba(0,0,0,.03) 100%),
    linear-gradient(135deg, #f3e3c7 0%, #ead6b1 55%, #dcc397 100%);
  border:2px solid rgba(40,28,18,.55);
  border-radius:6px;
  box-shadow:
    0 2px 3px rgba(0,0,0,.10),
    0 8px 14px rgba(0,0,0,.16),
    0 18px 26px rgba(0,0,0,.18),
    0 1px 0 rgba(255,255,255,.55) inset,
    0 -10px 18px rgba(90,60,30,.06) inset,
    -8px 0 14px rgba(255,255,255,.05) inset,
    8px 0 14px rgba(0,0,0,.04) inset;
  font-family:var(--sans);
  position:relative;
  min-height:auto;
}

    .pin-note:before,.qr-note:before{
      content:"";
      position:absolute;
      top:-14px;
      left:50%;
      transform:translateX(-50%);
      width:18px;
      height:18px;
      border-radius:50%;
      background:
        radial-gradient(circle at 35% 32%, rgba(255,255,255,.95) 0 2px, rgba(255,255,255,.55) 2px 4px, transparent 4px),
        radial-gradient(circle at 50% 52%, #f4ead9 0 5px, #d8c2a7 5px 7px, #8c6b4f 7px 9px);
      box-shadow:
        0 2px 3px rgba(0,0,0,.28),
        inset 0 -1px 2px rgba(0,0,0,.18);
      z-index:3;
    }

    .pin-note:after,
.qr-note:after,
.name:after,
.card:after{
  content:"";
  position:absolute;
  left:50%;
  top:0px;
  transform:translateX(-50%);
  width:2px;
  height:18px;
  border-radius:2px;
  background:linear-gradient(180deg, #d8d8d8 0%, #b7b7b7 35%, #7f7f7f 100%);
  box-shadow:
    0 1px 2px rgba(0,0,0,.20),
    1px 0 0 rgba(255,255,255,.20);
  z-index:2;
}    

  .name:after{
  top:-6px;
  height:16px;
}
    
.pin-note{
  width:75%;
  margin:8px auto 0;
  padding:12px;
  transform:rotate(-1.2deg);
  display:flex;
  align-items:center;
  justify-content:center;
}

    .pin-note button{
      width:100%;
      border:none;
      border-radius:10px;
      padding:12px 14px;
      background:linear-gradient(180deg,#9ebdcc,#8aabbb);
      color:#fff8ef;
      font-family:var(--sans);
      font-size:1rem;
      font-weight:700;
      cursor:pointer;
      box-shadow:var(--soft);
    }

    .status{
      display:none;
    }

    .center{
      text-align:center;
      padding-top:2px;
    }

    .title{
      display:inline-block;
      padding:16px 36px 13px;
      border-radius:24px;
      color:#fff9f0;
      font-size:clamp(2.4rem, 3.6vw, 3.25rem);
      line-height:1;
      box-shadow:var(--shadow);
      background:
        linear-gradient(90deg, rgba(255,255,255,.08), rgba(255,255,255,0) 14%, rgba(0,0,0,.08) 100%),
        linear-gradient(180deg,#9d693c,#7f5227);
    }

    .qr-note{
      padding:10px 10px 8px;
      transform:rotate(1.5deg);
      margin-top:10px;
    }

    .qr-note:before{
      background:
        radial-gradient(circle at 35% 32%, rgba(255,255,255,.85) 0 2px, rgba(255,255,255,.35) 2px 4px, transparent 4px),
        radial-gradient(circle at 50% 52%, #e59877 0 5px, #c97252 5px 7px, #845440 7px 9px);
    }

.qr-title{
  text-align:center;
  font-family:var(--sans);
  font-size:.95rem;
  font-weight:800;
  letter-spacing:.03em;
  margin:2px 0 8px;
  color:var(--ink);
}
    
    #qrcode{
      width:154px;
      height:154px;
      margin:4px auto 8px;
      background:#fff;
      border-radius:8px;
      padding:7px;
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);
    }

    #qrcode img{
      width:140px;
      height:140px;
      display:block;
    }

    .rows{
      display:grid;
      gap:12px;
      position:relative;
      z-index:1;
      margin-top:2px;
    }

.user-row{
  display:grid;
  grid-template-columns:110px max-content;
  gap:18px;
  align-items:center;
}

.name{
  justify-self:center;
  min-width:78px;
  padding:7px 10px;
  text-align:center;
  font-size:1rem;
  font-weight:700;
  background:
    linear-gradient(180deg, rgba(255,255,255,.45) 0%, rgba(255,255,255,.16) 18%, rgba(0,0,0,.03) 100%),
    linear-gradient(135deg, #f3e3c7 0%, #ead6b1 55%, #dcc397 100%);
  border:2px solid rgba(40,28,18,.55);
  border-radius:6px;
  box-shadow:
    0 2px 3px rgba(0,0,0,.10),
    0 8px 14px rgba(0,0,0,.16),
    0 18px 26px rgba(0,0,0,.18),
    0 1px 0 rgba(255,255,255,.55) inset,
    0 -10px 18px rgba(90,60,30,.06) inset,
    -8px 0 14px rgba(255,255,255,.05) inset,
    8px 0 14px rgba(0,0,0,.04) inset;
  transform:rotate(-1.4deg);
  position:relative;
  font-family:var(--sans);
}

.name:before{
  content:"";
  position:absolute;
  top:-20px;
  left:50%;
  transform:translateX(-50%);
  width:16px;
  height:16px;
  border-radius:50%;
  background:
    radial-gradient(circle at 35% 32%, rgba(255,255,255,.95) 0 2px, rgba(255,255,255,.5) 2px 4px, transparent 4px),
    radial-gradient(circle at 50% 52%, #efe6d6 0 4px, #d1bca2 4px 6px, #86664b 6px 8px);
  box-shadow:0 2px 3px rgba(0,0,0,.22), inset 0 -1px 2px rgba(0,0,0,.15);
  z-index:3;
}

.lane{
  display:flex;
  gap:10px;
  padding:8px 8px;
  min-height:78px;
  width:fit-content;
  justify-self:start;
  align-items:flex-start;
  border-top:2px solid rgba(122,82,45,.34);
  border-bottom:2px solid rgba(122,82,45,.34);
  border-left:1px solid rgba(255,255,255,.18);
  border-right:1px solid rgba(255,255,255,.18);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18);
}

.featured-lane{
  flex-wrap:wrap;
  width:auto;
  max-width:100%;
  align-content:flex-start;
}
    
.lane-blue{
  background:linear-gradient(180deg, #9bbbc9, #89aebe);
}

.lane-peach{
  background:linear-gradient(180deg, #e2a68a, #d79778);
}

.lane-green{
  background:linear-gradient(180deg, #b9c57a, #aebb66);
}

.card{
  min-height:68px;
  padding:8px 8px 6px;
  position:relative;
  background:
    linear-gradient(180deg, rgba(255,255,255,.45) 0%, rgba(255,255,255,.18) 18%, rgba(0,0,0,.03) 100%),
    linear-gradient(135deg, #f3e3c7 0%, #ead6b1 55%, #dcc397 100%);
  border:none;
  border-radius:4px;
  box-shadow:
    0 2px 3px rgba(0,0,0,.10),
    0 8px 14px rgba(0,0,0,.16),
    0 18px 26px rgba(0,0,0,.18),
    0 1px 0 rgba(255,255,255,.55) inset,
    0 -10px 18px rgba(90,60,30,.06) inset,
    -8px 0 14px rgba(255,255,255,.05) inset,
    8px 0 14px rgba(0,0,0,.04) inset;
  display:grid;
  align-content:start;
  gap:6px;
  transform-origin:center top;
  width:240px;
}

    .lane .card:nth-child(1){ transform:rotate(-1.5deg); }
    .lane .card:nth-child(2){ transform:rotate(.95deg); }
    .lane .card:nth-child(3){ transform:rotate(-.75deg); }

    .card:before{
      content:"";
      position:absolute;
      top:-14px;
      left:50%;
      transform:translateX(-50%);
      width:17px;
      height:17px;
      border-radius:50%;
      box-shadow:0 2px 3px rgba(0,0,0,.24), inset 0 -1px 2px rgba(0,0,0,.16);
      background:
        radial-gradient(circle at 35% 32%, rgba(255,255,255,.95) 0 2px, rgba(255,255,255,.45) 2px 4px, transparent 4px),
        radial-gradient(circle at 50% 52%, #efe6d6 0 4px, #d1bca2 4px 6px, #86664b 6px 8px);
      z-index:3;
    }

    .lane-peach .card:before{
      background:
        radial-gradient(circle at 35% 32%, rgba(255,255,255,.9) 0 2px, rgba(255,255,255,.35) 2px 4px, transparent 4px),
        radial-gradient(circle at 50% 52%, #e79a78 0 4px, #cb7354 4px 6px, #855341 6px 8px);
    }
    .lane-green .card:before{
      background:
        radial-gradient(circle at 35% 32%, rgba(255,255,255,.9) 0 2px, rgba(255,255,255,.35) 2px 4px, transparent 4px),
        radial-gradient(circle at 50% 52%, #93b8bb 0 4px, #6f9ea1 4px 6px, #4f6d70 6px 8px);
    }

    .title2{
      font-size:clamp(0.9rem, 1.1vw, 1.08rem);
      line-height:1.03;
      font-weight:700;
    }

    .meta{
      font-family:var(--sans);
      font-size:.74rem;
    }

.thumb{
  width:100%;
  aspect-ratio:4 / 1.7;
  object-fit:contain;
  object-position:center;
  border-radius:2px;
  border:2px solid rgba(226,212,193,.95);
  background:transparent;
  margin-top:2px;
  display:block;
}

/* =========================================================
   Kiosk-klocka
   Visas endast i fullscreen / kiosk
   ========================================================= */

.kiosk-clock{
  display:none;

  justify-self:start;
  align-self:start;

  position:relative;

  margin-top:6px;
  margin-left:12px;
  padding:2px 8px 12px;

  font-family:var(--sans);
  color:#1b0f08;

  transform:rotate(-0.35deg);

  text-shadow:
    0.4px 0 #1b0f08,
    -0.4px 0 #1b0f08,
    0 0.4px #1b0f08,
    0 -0.4px #1b0f08;
}


.kiosk-clock-time{
  font-size:2.7rem;
  font-weight:900;
  line-height:.95;

  letter-spacing:.025em;
}


.kiosk-clock-date{
  margin-top:7px;

  font-size:.82rem;
  font-weight:900;

  letter-spacing:.12em;
  text-transform:uppercase;

  opacity:.88;
}


/* Handritad linje under klockan */

.kiosk-clock::after{
  content:"";

  position:absolute;

  left:3px;
  bottom:1px;

  width:calc(100% - 3px);
  height:2px;

  border-radius:50%;

  background:
    linear-gradient(
      90deg,
      rgba(22,12,6,.18),
      rgba(22,12,6,.58) 16%,
      rgba(22,12,6,.36) 46%,
      rgba(22,12,6,.62) 78%,
      rgba(22,12,6,.18)
    );

  filter:blur(.15px);

  transform:rotate(-0.5deg);
}


/* Browser fullscreen */

:fullscreen .kiosk-clock{
  display:block;
}


/* Installerad PWA / kiosk display-mode */

@media (display-mode: fullscreen){
  .kiosk-clock{
    display:block;
  }
}    
    
.footer{
  margin-top:-12px;   /* drar footern närmare kalendern */

  padding-top:0;
  padding-bottom:0;

  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;

  font-family:var(--sans);
  position:relative;
  z-index:1;
}

.footer-small{
  position:relative;
  padding:4px 10px;

  font-size:1rem;
  font-weight:900;
  letter-spacing:.08em;
  text-transform:uppercase;

  color:#2a170c;

  text-shadow:
    0 1px 0 rgba(255,255,255,.75),
    0 1px 1px rgba(0,0,0,.28);
}

/* =========================================================
   Kalender - handritad direkt på korken
   ========================================================= */

.calendar-section{
  margin-top:auto;
  width:100%;
  padding:0 28px;
  position:relative;
  z-index:1;
}

.calendar-section.no-events{
  display:none;
}


/* =========================================================
   Rubriklapp: "Detta händer på Skröja"
   ========================================================= */

.calendar-heading{
  width:max-content;
  max-width:90%;

  margin:0 auto 24px;
  padding:10px 34px 9px;

  position:relative;

  font-family:var(--sans);
  font-size:1.35rem;
  font-weight:900;
  line-height:1.1;
  letter-spacing:.02em;
  text-align:center;

  color:#24160d;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.38) 0%,
      rgba(255,255,255,.10) 22%,
      rgba(0,0,0,.025) 100%
    ),
    linear-gradient(
      135deg,
      #f3e3c7 0%,
      #ead6b1 55%,
      #dcc397 100%
    );

  border:2px solid rgba(40,28,18,.55);
  border-radius:5px;

  box-shadow:
    0 2px 3px rgba(0,0,0,.10),
    0 8px 14px rgba(0,0,0,.16),
    0 15px 22px rgba(0,0,0,.14),
    0 1px 0 rgba(255,255,255,.55) inset;

  transform:rotate(-0.7deg);

  text-shadow:
    0 1px 0 rgba(255,255,255,.35);
}

/* Rund nål på rubriklappen */

.calendar-heading::before{
  content:"";
  position:absolute;

  top:-14px;
  left:50%;

  transform:translateX(-50%);

  width:18px;
  height:18px;

  border-radius:50%;

  background:
    radial-gradient(
      circle at 35% 32%,
      rgba(255,255,255,.95) 0 2px,
      rgba(255,255,255,.50) 2px 4px,
      transparent 4px
    ),
    radial-gradient(
      circle at 50% 52%,
      #efe6d6 0 5px,
      #d1bca2 5px 7px,
      #86664b 7px 9px
    );

  box-shadow:
    0 2px 3px rgba(0,0,0,.25),
    inset 0 -1px 2px rgba(0,0,0,.15);

  z-index:3;
}


/* Nålens metallspets */

.calendar-heading::after{
  content:"";
  position:absolute;

  top:0;
  left:50%;

  transform:translateX(-50%);

  width:2px;
  height:18px;

  background:
    linear-gradient(
      180deg,
      #d8d8d8,
      #a8a8a8 45%,
      #707070
    );

  box-shadow:
    0 1px 2px rgba(0,0,0,.20);
}


/* =========================================================
   Själva kalendern
   Ingen panel eller bakgrund:
   den ligger direkt på korken.
   ========================================================= */

.calendar-panel{
  width:100%;
  margin:0 auto;
  padding:0;

  font-family:var(--sans);

  color:#20140c;

  background:none;
  border:none;
  border-radius:0;
  box-shadow:none;

  backdrop-filter:none;
  -webkit-backdrop-filter:none;
}



/* =========================================================
   Veckodagar
   ========================================================= */

.calendar-weekdays{
  display:grid;
  grid-template-columns:90px repeat(7, 1fr);

  gap:0;
  margin-bottom:0;

  font-family:var(--sans);
  font-size:1.08rem;
  font-weight:900;

  text-transform:uppercase;
  text-align:center;

  color:#160c06;
}

.calendar-weekdays > div{
  position:relative;
  padding:5px 2px 8px;

  border-bottom:none;

  text-shadow:
    0.4px 0 #1c1008,
    -0.4px 0 #1c1008,
    0 0.4px #1c1008,
    0 -0.4px #1c1008;
}

.calendar-weekdays > div::after{
  content:"";
  position:absolute;

  left:0;
  bottom:-1px;

  width:100%;
  height:2px;

  border-radius:50%;

  background:
    linear-gradient(
      90deg,
      rgba(22,12,6,.22),
      rgba(22,12,6,.55) 15%,
      rgba(22,12,6,.38) 48%,
      rgba(22,12,6,.56) 80%,
      rgba(22,12,6,.22)
    );

  filter:blur(.15px);
}

.calendar-weekdays > div:nth-child(2n)::after{
  height:2.3px;
  opacity:.9;
}

.calendar-weekdays > div:nth-child(3n)::after{
  height:1.7px;
  opacity:.85;
}

.calendar-weekdays > div:nth-child(5n)::after{
  height:2.1px;
}    

.calendar-month-label{
  display:flex;
  align-items:center;
  justify-content:center;

  padding:8px 6px;

  font-family:var(--sans);
  font-size:.9rem;
  font-weight:800;

  text-transform:uppercase;
  letter-spacing:.04em;

  color:#1b0f08;

border-right:2px solid rgba(22,12,6,.72);
border-bottom:2px solid rgba(22,12,6,.72);

  text-shadow:
    0.35px 0 #1b0f08,
    -0.35px 0 #1b0f08,
    0 0.35px #1b0f08,
    0 -0.35px #1b0f08;
}   
    
/* =========================================================
   Kalenderns rutnät
   ========================================================= */

.calendar-grid{
  display:grid;
  grid-template-columns:90px repeat(7, 1fr);
  gap:0;

  position:relative;
}

.calendar-grid::before{
  content:"";
  position:absolute;

  left:0;
  top:1px;

  width:2px;
  height:calc(100% - 2px);

  border-radius:50%;

  background:
    linear-gradient(
      180deg,
      rgba(22,12,6,.18),
      rgba(22,12,6,.55) 18%,
      rgba(22,12,6,.36) 50%,
      rgba(22,12,6,.58) 82%,
      rgba(22,12,6,.18)
    );

  filter:blur(.15px);

  transform:rotate(.12deg);
}

/* Varje dag är transparent */

.calendar-day{
  min-height:82px;
  padding:9px 9px;

  position:relative;

  background:none;
  border-radius:0;

  border-right:2px solid rgba(22,12,6,.72);
  border-bottom:2px solid rgba(22,12,6,.72);
}

/* Lite handritad variation på vertikala linjer */
.calendar-day::after{
  content:"";
  position:absolute;

  top:1px;
  right:-2px;

  width:2px;
  height:calc(100% - 2px);

  border-radius:50%;

  background:
    linear-gradient(
      180deg,
      rgba(22,12,6,.20),
      rgba(22,12,6,.52) 18%,
      rgba(22,12,6,.38) 48%,
      rgba(22,12,6,.58) 78%,
      rgba(22,12,6,.18)
    );

  filter:blur(.15px);

  transform:rotate(.18deg);
  transform-origin:center;
}

.calendar-day::before{
  content:"";
  position:absolute;

  left:1px;
  bottom:-2px;

  width:calc(100% - 2px);
  height:2px;

  border-radius:50%;

  background:
    linear-gradient(
      90deg,
      rgba(22,12,6,.18),
      rgba(22,12,6,.50) 15%,
      rgba(22,12,6,.34) 45%,
      rgba(22,12,6,.56) 76%,
      rgba(22,12,6,.18)
    );

  filter:blur(.15px);

  transform:rotate(-.15deg);
  transform-origin:center;
}

/*
 * Lite ojämn känsla på linjerna genom subtil variation.
 * Det gör att det ser mindre "digitalt perfekt" ut.
 */

.calendar-day:nth-child(2n)::after{
  width:2.4px;
  opacity:.92;
  transform:rotate(-.18deg);
}

.calendar-day:nth-child(3n)::before{
  height:2.5px;
  opacity:.88;
  transform:rotate(.18deg);
}

.calendar-day:nth-child(4n)::after{
  width:1.6px;
  opacity:.82;
}

.calendar-day:nth-child(5n)::before{
  height:1.7px;
  opacity:.85;
}

.calendar-day:nth-child(7n)::after{
  opacity:.72;
}

/* Datum från föregående/nästa månad */

.calendar-day.other-month{

}

  display:inline-flex;

  min-width:44px;
  height:44px;

/* =========================================================
   Datum
   ========================================================= */

.calendar-date{
  margin-bottom:5px;

  font-family:var(--sans);
  font-size:1.15rem;
  font-weight:800;

  color:#1b0f08;

  text-shadow:

/* =========================================================
   Kalenderevent = liten fastnålad lapp
   ========================================================= */

.calendar-event{
  position:relative;

  display:block;

  width:calc(100% - 6px);

  margin:8px 3px 3px;

  padding:8px 7px 6px;

  border-radius:3px;

  font-family:var(--sans);
  font-size:.95rem;
  line-height:1.2;
  font-weight:800;

  text-align:center;

  color:#2f2117;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.42) 0%,
      rgba(255,255,255,.12) 20%,
      rgba(0,0,0,.025) 100%
    ),
    linear-gradient(
      135deg,
      #f2dfa9 0%,
      #e9cb7f 58%,
      #d9b761 100%
    );

  border:1px solid rgba(80,55,24,.40);

  box-shadow:
    0 2px 3px rgba(0,0,0,.14),
    0 6px 9px rgba(0,0,0,.14),
    0 1px 0 rgba(255,255,255,.45) inset;

  transform:rotate(-1.1deg);

  transform-origin:center top;
}


/* Variera vinkeln om flera event finns */

.calendar-event:nth-child(even){
  transform:rotate(1deg);
}

.calendar-event:nth-child(3n){
  transform:rotate(-0.5deg);
}


/* Nål på eventlappen */

.calendar-event::before{
  content:"";

  position:absolute;

  top:-8px;
  left:50%;

  transform:translateX(-50%);

  width:11px;
  height:11px;

  border-radius:50%;

  background:
    radial-gradient(
      circle at 35% 32%,
      rgba(255,255,255,.95) 0 1px,
      rgba(255,255,255,.45) 1px 3px,
      transparent 3px
    ),
    radial-gradient(
      circle at 50% 52%,
      #eee4d2 0 3px,
      #cbb597 3px 5px,
      #795a40 5px 6px
    );

  box-shadow:
    0 2px 2px rgba(0,0,0,.25);

  z-index:3;
}

function updateKioskClock() {

  const now = new Date();

  kioskClockTime.textContent =
    now.toLocaleTimeString(
      'sv-SE',
      {
        hour:'2-digit',
        minute:'2-digit'
      }
    );


  const weekday =
    new Intl.DateTimeFormat(
      'sv-SE',
      { weekday:'short' }
    )
      .format(now)
      .replace('.', '')
      .toUpperCase();


  const day =
    now.getDate();


  const month =
    new Intl.DateTimeFormat(
      'sv-SE',
      { month:'short' }
    )
      .format(now)
      .replace('.', '')
      .toUpperCase();


  kioskClockDate.textContent =
    `${weekday} ${day} ${month}`;
}

function isRaspberryPi() {
  const params =
    new URLSearchParams(window.location.search);

  if (params.get('raspberrypi') === '1') {
    return true;
  }

  const userAgent =
    (navigator.userAgent || '').toLowerCase();

  const platform =
    (navigator.platform || '').toLowerCase();

  const isLinux =
    userAgent.includes('linux') ||
    platform.includes('linux');

  const isArm =
    userAgent.includes('arm') ||
    userAgent.includes('aarch64') ||
    platform.includes('arm') ||
    platform.includes('aarch64');

  return isLinux && isArm;
}

function configureDisplayForHardware() {

    document.documentElement.classList.add(

  } else {
    document.documentElement.classList.remove(
      'raspberry-pi'
    );

    console.log(

const hiddenActivities = [

];

    function formatTime(isoString) {

    function getBlobBaseUrl() {
      return `https://${azureConfig.accountName}.blob.core.windows.net/${azureConfig.containerName}`;
    }

async function listJsonBlobs() {
  const { accountName, containerName, sasToken } = azureConfig;
  if (!accountName || !containerName || !sasToken || sasToken.includes('PASTA_IN')) {
    throw new Error('Azure-inställningar saknas. Lägg in en giltig SAS-token i dashboardfilen.');
  }

  const query = sasToken.replace(/^\?/, '');
  const url = `https://${accountName}.blob.core.windows.net/${containerName}?restype=container&comp=list&include=metadata&${query}`;
  const response = await fetch(url);
  if (!response.ok) throw new Error(`Kunde inte läsa från Azure (${response.status}).`);

  const xml = await response.text();
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  const blobNodes = Array.from(doc.querySelectorAll('Blob'));

  return blobNodes
    .map(blob => {
      const name = blob.querySelector('Name')?.textContent || '';
      const lastModified = blob.querySelector('Properties > Last-Modified')?.textContent || '';
      return { name, lastModified };
    })
    .filter(blob => blob.name.endsWith('.json'));
}

    async function readJsonRecord(fileName) {
      const query = azureConfig.sasToken.replace(/^\?/, '');
      const url = `${getBlobBaseUrl()}/${encodeURIComponent(fileName)}?${query}`;
      const response = await fetch(url);
      if (!response.ok) throw new Error(`Kunde inte läsa ${fileName}`);
      return response.json();
    }

function isNightMode() {
  const hour = new Date().getHours();
  return hour >= 23 || hour < 9;
}

function updateNightMode() {
  const night = isNightMode();
  nightScreen.style.display = night ? 'block' : 'none';
}

async function safeLoadActivities() {
  if (isNightMode()) {
    updateNightMode();
    return;
  }

  updateNightMode();

  try {
    await loadActivities();
  } catch (error) {
    console.error(error);
    if (pollStatus) pollStatus.textContent = '';
  }
}

function startPolling() {
  if (pollTimer) clearInterval(pollTimer);

  pollTimer = setInterval(() => {
    safeLoadActivities();
  }, pollIntervalMs);
}    

async function loadActivities(force = false) {
  if (pollStatus) pollStatus.textContent = '';

  const files = await listJsonBlobs();

  const sortedFiles = files
    .slice()
    .sort((a, b) =>
      a.name.localeCompare(b.name)
    )
    .reverse();

  /*
   * Signaturen innehåller ALLA JSON-filer.
   *
   * Därmed märker dashboarden:
   * - ny aktivitet
   * - borttagen aktivitet
   * - ändrad aktivitet
   * - nytt/borttaget kalenderevent
   */
  const fileSignature = sortedFiles
    .map(file =>
      `${file.name}:${file.lastModified}`
    )
    .join('|');

  if (
    !force &&
    hasLoadedOnce &&
    fileSignature === lastSeenFileSignature
  ) {
    return;
  }

  lastSeenFileSignature = fileSignature;
  hasLoadedOnce = true;

  /*
   * Läs alla JSON-poster.
   *
   * Det behövs för kalendern eftersom ett framtida event
   * kan ha skapats för länge sedan.
   */
  const allFiles =
    sortedFiles.map(file => file.name);

  const records = await Promise.all(
    allFiles.map(readJsonRecord)
  );

  /*
   * --------------------------------
   * KALENDER
   * --------------------------------
   */

  const calendarEvents = records
    .filter(record =>
      record &&
      record.activity === 'Kalenderevent' &&
      record.eventDate
    );

  renderCalendar(calendarEvents);

  /*
   * --------------------------------
   * VANLIGA AKTIVITETER
   * --------------------------------
   */

  const cutoff =
    Date.now() -
    (14 * 24 * 60 * 60 * 1000);

  const byUser = Object.fromEntries(
    users.map(user => [user.name, []])
  );

  records
    .filter(record =>
      record &&
      record.member &&
      record.timestamp
    )

    .filter(record => {
      const ts =
        new Date(record.timestamp).getTime();

      return (
        Number.isFinite(ts) &&
        ts >= cutoff
      );
    })

    /*
     * Kalenderevent ska INTE visas
     * som vanliga aktivitetskort.
     */
    .filter(record =>
      record.activity !== 'Kalenderevent'
    )

    .filter(record =>
      !hiddenActivities.includes(
        record.activity
      )
    )

    .sort(
      (a, b) =>
        new Date(b.timestamp) -
        new Date(a.timestamp)
    )

    .forEach(record => {
      if (!byUser[record.member]) return;

      if (
        record.member === 'Lerverkstan' ||
        byUser[record.member].length < 4
      ) {
        byUser[record.member].push(record);
      }
    });

  renderRows(byUser);

  if (pollStatus) {
    pollStatus.textContent = '';
  }
}

function renderCalendar(events) {
  if (!calendarPanel || !calendarGrid) return;

  const validEvents = events
    .filter(event =>
      event &&
      event.activity === 'Kalenderevent' &&
      event.eventDate
    )
    .sort((a, b) =>
      a.eventDate.localeCompare(b.eventDate)
    );

  const today = new Date();

  // Måndag i nuvarande vecka
  const calendarStart = new Date(today);

  const daysSinceMonday =
    (today.getDay() + 6) % 7;

  calendarStart.setDate(
    today.getDate() - daysSinceMonday
  );

  calendarStart.setHours(0, 0, 0, 0);

  calendarGrid.innerHTML = '';

  /*
   * 6 veckor
   */
  for (let week = 0; week < 6; week++) {

    /*
     * -----------------------------------------
     * Bestäm vilken månad som "vinner" veckan
     * -----------------------------------------
     */

    const monthCounts = new Map();

    for (let dayIndex = 0; dayIndex < 7; dayIndex++) {

      const date = new Date(calendarStart);

      date.setDate(
        calendarStart.getDate() +
        week * 7 +
        dayIndex
      );

      const key =
        `${date.getFullYear()}-${date.getMonth()}`;

      if (!monthCounts.has(key)) {
        monthCounts.set(key, {
          count:0,
          date:new Date(date)
        });
      }

      monthCounts.get(key).count++;
    }

    const winningMonth =
      [...monthCounts.values()]
        .sort((a, b) =>
          b.count - a.count
        )[0];

    /*
     * Månad till vänster
     */

    const monthLabel =
      document.createElement('div');

    monthLabel.className =
      'calendar-month-label';

    const monthName =
      new Intl.DateTimeFormat(
        'sv-SE',
        { month:'short' }
      )
        .format(winningMonth.date)
        .replace('.', '');

    monthLabel.textContent =
      monthName;

    calendarGrid.appendChild(
      monthLabel
    );


    /*
     * -----------------------------------------
     * Veckans 7 dagar
     * -----------------------------------------
     */

    for (let dayIndex = 0; dayIndex < 7; dayIndex++) {

      const i =
        week * 7 + dayIndex;

      const currentDate =
        new Date(calendarStart);

      currentDate.setDate(
        calendarStart.getDate() + i
      );

      const year =
        currentDate.getFullYear();

      const month =
        currentDate.getMonth();

      const day =
        currentDate.getDate();

      const dateString = [
        year,
        String(month + 1).padStart(2, '0'),
        String(day).padStart(2, '0')
      ].join('-');


      const dayElement =
        document.createElement('div');

      dayElement.className =
        'calendar-day';


      /*
       * Idag
       */

      const isToday =
        year === today.getFullYear() &&
        month === today.getMonth() &&
        day === today.getDate();

      if (isToday) {
        dayElement.classList.add('today');
      }


      /*
       * Datum
       */

      const dateElement =
        document.createElement('div');

      dateElement.className =
        'calendar-date';

      dateElement.textContent =
        day;

      dayElement.appendChild(
        dateElement
      );


      /*
       * Event
       */

      const todaysEvents =
        validEvents.filter(event =>
          event.eventDate === dateString
        );

      todaysEvents.forEach(event => {

        const eventElement =
          document.createElement('div');

        eventElement.className =
          'calendar-event';

        eventElement.textContent =
          event.eventDescription ||
          'Kalenderevent';

        dayElement.appendChild(
          eventElement
        );
      });

      calendarGrid.appendChild(
        dayElement
      );
    }
  }
}

  `;
  lane.appendChild(card);
});

        row.appendChild(nameTag);
        row.appendChild(lane);
        rowsContainer.appendChild(row);
      });
    }

function updateFullscreenCardVisibility() {
  const fullscreenCard = document.querySelector('.pin-note');
  const clock = document.getElementById('kiosk-clock');

  const isFullscreen =
    Boolean(document.fullscreenElement) ||
    window.matchMedia('(display-mode: fullscreen)').matches ||
    isRaspberryPi();

  if (fullscreenCard) {
    fullscreenCard.style.visibility =
      isFullscreen ? 'hidden' : '';

    fullscreenCard.style.pointerEvents =
      isFullscreen ? 'none' : '';
  }

  if (clock) {
    clock.style.display =
      isFullscreen ? 'block' : 'none';
  }
}

document.addEventListener(
  'fullscreenchange',
  updateFullscreenCardVisibility
);

window.addEventListener(
  'load',
  updateFullscreenCardVisibility
);

document.getElementById('fullscreen-btn').addEventListener('click', async () => {
  try {
    if (!document.fullscreenElement) {
      await document.documentElement.requestFullscreen();
    } else {
      await document.exitFullscreen();
    }

    updateFullscreenCardVisibility();
  } catch (error) {
    console.error(error);
    if (pollStatus) pollStatus.textContent = '';
  }
});

buildQrCode();
updateNightMode();

if (!isNightMode()) {
  safeLoadActivities();
} else {
  renderRows({});
}

function scheduleDailyCodeReload() {
  const reloadAfter = 24 * 60 * 60 * 1000;

  setTimeout(() => {
    const url = new URL(window.location.href);

    // Forces the browser/CDN to request the newest HTML.
    url.searchParams.set('_refresh', Date.now());

    // Avoids adding a new browser-history entry each day.
    window.location.replace(url.toString());
  }, reloadAfter);
}

function setupKioskMouseCursor() {
  let mouseHideTimer = null;

  function showMouseCursor() {
    document.body.style.cursor = 'default';

    if (mouseHideTimer) {
      clearTimeout(mouseHideTimer);
    }

    mouseHideTimer = setTimeout(() => {
      document.body.style.cursor = 'none';
    }, 3000);
  }

  document.addEventListener('mousemove', showMouseCursor);
  document.addEventListener('mousedown', showMouseCursor);
  document.addEventListener('wheel', showMouseCursor);

  showMouseCursor();
}

setupKioskMouseCursor();
scheduleDailyCodeReload();
startPolling();

  </script>
</body>
