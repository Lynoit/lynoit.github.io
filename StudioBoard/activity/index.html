<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Aktivitet</title>
  <link rel="stylesheet" href="core/styles.css" />
</head>
<body>
<div class="phone">
    <div class="screen">
      <div class="content">
        <div class="note" id="app-note"></div>

        <section id="step-user" class="step active">
          <h1>Vem är du?</h1>
          <div class="rule"></div>
          <div class="stack" id="user-buttons"></div>
        </section>

        <section id="step-activity" class="step">
          <h1>Vad gör du?</h1>
          <div class="rule"></div>
          <div class="session-total" id="session-total" hidden>
            Uttagen keramik denna session
            <strong id="session-total-value">0 kg</strong>
          </div>
          <div class="stack" id="activity-buttons"></div>
          <div class="textblock">
            <label for="custom-activity">Skriv lapp på anslagstavlan</label>
            <input id="custom-activity" type="text" maxlength="80" placeholder="Skriv lapp här" />
          </div>
          <div class="stack">
            <button class="btn-accent" id="activity-continue">Fortsätt</button>
            <button class="btn-soft" id="activity-back">Tillbaka</button>
          </div>
        </section>


        <section id="step-weight" class="step">
          <h1>Hur mycket vägde keramiken?</h1>
          <div class="rule"></div>
          <div class="textblock">
            <label for="ceramic-weight">Vikt i gram</label>
            <input id="ceramic-weight" type="number" min="1" step="1" inputmode="numeric" placeholder="Till exempel 2500" />
          </div>
          <div class="stack">
            <button class="btn-accent" id="weight-continue">Fortsätt</button>
            <button class="btn-soft" id="weight-back">Tillbaka</button>
          </div>
        </section>

        <section id="step-calendar-event" class="step">
          <h1>Kalenderevent</h1>
          <div class="rule"></div>
          <div class="textblock">
            <label for="event-date">Datum för eventet</label>
            <input id="event-date" type="date" />
          </div>
          <div class="textblock">
            <label for="event-description">Beskrivning</label>
            <textarea id="event-description" maxlength="500" placeholder="Beskriv eventet"></textarea>
          </div>
          <div class="stack">
            <button class="btn-accent" id="calendar-event-continue">Fortsätt</button>
            <button class="btn-soft" id="calendar-event-back">Tillbaka</button>
          </div>
        </section>

        <section id="step-photo" class="step">
          <h1>Vill du ta en bild?</h1>
          <div class="rule"></div>
          <div class="prompt-card">
            <p>Om du väljer <strong>Ja</strong> öppnas kameran direkt på mobilen.</p>
            <div class="pair">
              <button class="btn green" id="photo-yes">Ja</button>
              <button class="btn coral" id="photo-no">Nej</button>
            </div>
          </div>
          <input id="camera-input" type="file" accept="image/*" capture="environment" />
          <div class="stack" style="margin-top:12px">
            <button class="btn-soft" id="photo-back">Tillbaka</button>
          </div>
        </section>

<section id="step-summary" class="step">
  <div class="summary">

    <div class="row">
      <strong>Namn</strong>
      <span id="summary-user"></span>
    </div>

    <div class="row">
      <strong>Aktivitet</strong>
      <span id="summary-activity"></span>
    </div>

    <div class="row" id="summary-weight-row" hidden>
      <strong>Vikt</strong>
      <span id="summary-weight"></span>
    </div>

    <div class="row" id="summary-event-date-row" hidden>
      <strong>Eventdatum</strong>
      <span id="summary-event-date"></span>
    </div>

    <div class="row" id="summary-event-description-row" hidden>
      <strong>Beskrivning</strong>
      <span id="summary-event-description"></span>
    </div>

    <div class="row">
      <strong>Tid</strong>
      <span id="summary-time"></span>
    </div>

    <div class="row" id="summary-image-row" hidden>
      <strong>Bild</strong>
      <span id="summary-image-text"></span>
    </div>

    <div class="preview" id="preview-wrap" hidden>
      <span>Ingen bild vald</span>
    </div>

  </div>

  <div class="decision">
    <div class="ask">Skicka till anslagstavla?</div>
    <button class="btn yellow" id="send-yes">Ja, skicka</button>
    <button class="btn-soft" id="send-no">Nej, börja om</button>
  </div>
</section>

        <section id="step-result" class="step">
          <h1 id="result-title">Klart</h1>
          <div class="rule"></div>
          <div class="result-card">
            <p id="result-message"></p>
            <p id="result-submessage"></p>
          </div>
          <div class="stack" style="margin-top:12px">
            <button class="btn green" id="start-over">Ny registrering</button>
          </div>
        </section>
      </div>
    </div>
  </div>
<script src="core/bootstrap.js"></script>
</body>
</html>
