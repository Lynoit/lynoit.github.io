<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard</title>
  <link rel="stylesheet" href="core/styles.css" />
</head>
<body>
<div id="night-screen"></div>
  <div class="frame">
    <div class="board">
<div class="top">

  <div class="top-left">

    <div class="pin-note">
      <button id="fullscreen-btn"></button>
      <div class="status" id="poll-status"></div>
    </div>

    <div class="kiosk-clock" id="kiosk-clock">
      <div class="kiosk-clock-time" id="kiosk-clock-time">14:37</div>
      <div class="kiosk-clock-date" id="kiosk-clock-date">TIS 18 AUG</div>
    </div>


    <div class="kiosk-contact-note" id="kiosk-contact-note">
      <div class="kiosk-contact-title" id="phone-note-title"></div>
      <div id="phone-note-rows"></div>
    </div>

  </div>

  <div class="center">
    <div class="logo-wrap">
      <img id="customer-logo" src="" alt="">
    </div>
  </div>

  <div class="qr-note">
    <div class="qr-title" id="qr-title"></div>
    <div id="qrcode"></div>
  </div>

</div>

<div class="content-stack">

  <section class="dashboard-section">
    <div class="dashboard-heading" id="dashboard-heading"></div>
    <div class="rows" id="rows"></div>
  </section>

<div class="weekly-schedule-section" id="weekly-schedule-section">
  <div class="weekly-schedule-heading" id="weekly-schedule-heading"></div>
  <div class="weekly-schedule-wrap">
    <div class="weekly-time-labels" aria-hidden="true">
      <div class="spacer"></div>
      <div class="weekly-time-label">8–15</div>
      <div class="weekly-time-label">15–22</div>
    </div>
    <div class="weekly-schedule-grid" id="weekly-schedule-grid"></div>
  </div>
</div>

<div class="calendar-section" id="calendar-section">
  
  <div class="calendar-heading" id="calendar-heading"></div>

  <div class="calendar-panel" id="calendar-panel">

    <div class="calendar-weekdays">
      <div class="month-header"></div>
      <div>Mån</div>
      <div>Tis</div>
      <div>Ons</div>
      <div>Tor</div>
      <div>Fre</div>
      <div>Lör</div>
      <div>Sön</div>
    </div>

    <div class="calendar-grid" id="calendar-grid"></div>

  </div>

</div>

</div><!-- /.content-stack -->

<div class="footer">
  <span class="footer-small">Powered by</span>

  <img
    class="footer-logo"
    id="footer-logo"
    src=""
    alt="">
</div>
    </div>
  </div>
  <script src="core/bootstrap.js"></script>
</body>
</html>
