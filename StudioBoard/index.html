<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StudioBoard</title>
  <style>
    :root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#172036;background:#f5efe6;}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;}
    main{width:min(620px,100%);background:#fffaf2;border:1px solid #e2d4bf;border-radius:18px;padding:28px;box-shadow:0 18px 40px rgba(80,55,24,.12);}
    h1{margin:0 0 8px;font-size:2rem;}
    p{margin:0 0 22px;color:#6d5b48;}
    a{display:block;margin:12px 0;padding:14px 16px;border-radius:12px;background:#172036;color:#fff;text-decoration:none;font-weight:700;}
    a:hover{background:#24304e;}
    small{display:block;margin-top:18px;color:#8b7660;}
  </style>
</head>
<body>
  <main>
    <h1>StudioBoard</h1>
    <p>Välj app för kunden Skröja.</p>
    <a href="dashboard/?customer=skroja">Dashboard / Anslagstavla</a>
    <a href="activity/?customer=skroja">Activity / Registrering</a>
    <a href="admin/?customer=skroja">Admin / Statistik</a>
    <small>För ny kund: kopiera customers/_template och öppna med ?customer=&lt;kund-id&gt;.</small>
  </main>
</body>
</html>
