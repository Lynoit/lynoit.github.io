<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skröja Marina – Yacht Club</title>
  <style>
@import url('https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=Marcellus&display=swap');
:root{
  --page-bg:#e2ddd2;
  --frame-bg:#70492b;
  --frame-bg-2:#2b170e;
  --board-bg:#17354d;
  --board-bg-2:#102739;
  --board-overlay:rgba(255,255,255,.05);
  --text:#f5eee0;
  --muted:rgba(245,238,224,.74);
  --line:rgba(221,191,132,.60);
  --line-soft:rgba(221,191,132,.26);
  --panel-bg:#2b4a61;
  --panel-bg-2:#1b3448;
  --panel-border:rgba(221,191,132,.35);
  --panel-shadow:0 14px 30px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.08);
  --accent:#c4a164;
  --accent-2:#9b7942;
  --lane-a:rgba(60,97,124,.55);
  --lane-b:rgba(115,75,60,.52);
  --lane-c:rgba(68,109,95,.52);
  --lane-d:rgba(127,109,53,.52);
  --tag-bg:#f0e1bf;
  --tag-border:rgba(179,139,68,.35);
  --tag-text:#553814;
  --event-bg:#f2d398;
  --event-border:rgba(154,112,38,.35);
  --event-text:#5d3c13;
  --footer-text:#e7d7b5;
  --heading-font:"Marcellus", serif;
  --body-font:"Cormorant Garamond", Georgia, serif;
  --card-font:"Inter", Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;}
body{
  min-height:100vh;
  padding:0;
  color:var(--text);
  font-family:var(--body-font);
  background:var(--page-bg);
}
.frame{
  min-height:100vh;
  padding:18px;
  display:flex;
  flex-direction:column;
  background:
    linear-gradient(135deg, rgba(255,255,255,.12), rgba(255,255,255,0) 30%, rgba(0,0,0,.12)),
    linear-gradient(135deg, var(--frame-bg), var(--frame-bg-2));
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.08), inset 0 0 32px rgba(255,255,255,.05);
}
.board{
  min-height:calc(100vh - 36px);
  padding:20px 18px 12px;
  border-radius:10px;
  position:relative;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  background:
    radial-gradient(circle at 12% 16%, rgba(255,255,255,.06) 0 12%, transparent 13%),
    radial-gradient(circle at 78% 24%, rgba(255,255,255,.05) 0 10%, transparent 11%),
    radial-gradient(circle at 55% 72%, rgba(255,255,255,.035) 0 12%, transparent 13%),
    linear-gradient(180deg, var(--board-overlay), rgba(0,0,0,.04)),
    linear-gradient(135deg, var(--board-bg), var(--board-bg-2));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.08), inset 0 0 40px rgba(0,0,0,.08);
}
.board::before{
  content:"";
  position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(180deg, rgba(255,255,255,.03), transparent 20% 80%, rgba(0,0,0,.09)), radial-gradient(circle at 25% 35%, rgba(255,255,255,.03) 0 14%, transparent 15%), radial-gradient(circle at 78% 60%, rgba(255,255,255,.025) 0 12%, transparent 13%);
  opacity:1;
  mix-blend-mode:screen;
}
.top{display:grid;grid-template-columns:210px 1fr 200px;gap:18px;align-items:start;margin-bottom:28px;position:relative;z-index:1;}
.top-left{width:100%;position:relative;}
.pin-note,.qr-note,.name,.card,.calendar-heading,.dashboard-heading,.weekly-schedule-heading,.kiosk-contact-note{
  background:
    linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,.05) 28%, rgba(0,0,0,.03) 100%),
    linear-gradient(135deg, var(--panel-bg), var(--panel-bg-2));
  border:1px solid var(--panel-border);
  border-radius:12px;
  box-shadow:var(--panel-shadow);
  color:var(--text);
}
.pin-note::before,.pin-note::after,.qr-note::before,.qr-note::after,.name::before,.name::after,.card::before,.card::after,.calendar-heading::before,.calendar-heading::after,.dashboard-heading::before,.dashboard-heading::after,.weekly-schedule-heading::before,.weekly-schedule-heading::after,.kiosk-contact-note::before,.kiosk-contact-note::after{
  display:none !important;
}
.pin-note{width:78%;margin:8px auto 0;padding:12px;transform:rotate(-.6deg);display:flex;align-items:center;justify-content:center;}
.pin-note button{width:100%;border:none;border-radius:10px;padding:12px 14px;background:linear-gradient(180deg,var(--accent),var(--accent-2));color:#fff;font-family:var(--card-font);font-size:1rem;font-weight:700;cursor:pointer;box-shadow:0 8px 18px rgba(0,0,0,.12);}
.status{display:none;}
.center{text-align:center;padding-top:2px;}
.logo-wrap{display:flex;justify-content:center;align-items:center;transform:translateY(-8px);}
.logo-wrap img{max-height:280px;width:auto;filter:drop-shadow(0 8px 16px rgba(0,0,0,.18));}
.title{display:inline-block;padding:12px 32px 10px;border-radius:999px;color:#fff;font-size:clamp(2.3rem, 3.6vw, 3.2rem);line-height:1;box-shadow:0 16px 30px rgba(0,0,0,.16);font-family:var(--heading-font);font-weight:600;background:linear-gradient(180deg,var(--accent),var(--accent-2));letter-spacing:.01em;}
.qr-note{padding:10px 10px 8px;transform:rotate(.8deg);margin-top:10px;}
.qr-title{text-align:center;font-family:var(--card-font);font-size:.96rem;font-weight:800;letter-spacing:.03em;margin:2px 0 8px;color:var(--text);}
#qrcode{width:154px;height:154px;margin:4px auto 8px;background:#fff;border-radius:8px;padding:7px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);}
#qrcode img{width:140px;height:140px;display:block;}
.rows{display:grid;gap:12px;position:relative;z-index:1;margin-top:2px;}
.user-row{display:grid;grid-template-columns:110px minmax(0,1fr);gap:18px;align-items:center;}
.name{justify-self:center;min-width:78px;padding:9px 10px;text-align:center;font-size:1rem;font-weight:700;transform:rotate(-.6deg);position:relative;font-family:var(--card-font);}
.lane{display:flex;gap:10px;padding:10px;min-height:86px;width:fit-content;max-width:100%;justify-self:start;align-items:flex-start;border:1px solid var(--line-soft);border-radius:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.12);backdrop-filter:blur(1px);}
.featured-lane{flex-wrap:wrap;width:auto;max-width:100%;align-content:flex-start;}
.lane-blue{background:linear-gradient(180deg, var(--lane-a), color-mix(in srgb, var(--lane-a) 78%, #000 22%));}
.lane-peach{background:linear-gradient(180deg, var(--lane-b), color-mix(in srgb, var(--lane-b) 78%, #000 22%));}
.lane-green{background:linear-gradient(180deg, var(--lane-c), color-mix(in srgb, var(--lane-c) 78%, #000 22%));}
.lane-yellow{background:linear-gradient(180deg, var(--lane-d), color-mix(in srgb, var(--lane-d) 78%, #000 22%));}
.card{min-height:85px;padding:12px 12px 10px;position:relative;display:grid;align-content:start;gap:8px;transform-origin:center top;width:300px;font-family:var(--card-font);}
.lane .card:nth-child(1){transform:rotate(-.9deg);}
.lane .card:nth-child(2){transform:rotate(.7deg);}
.lane .card:nth-child(3){transform:rotate(-.4deg);}
.title2{font-size:clamp(1.08rem, 1.35vw, 1.3rem);line-height:1.08;font-weight:700;}
.meta{font-family:var(--body-font);font-size:.9rem;color:var(--muted);}
.thumb{display:block;width:auto;height:auto;max-width:100%;max-height:220px;object-fit:contain;justify-self:center;border:none;border-radius:6px;background:transparent;margin-top:2px;}
.kiosk-clock{display:none;justify-self:start;align-self:start;position:relative;margin-top:2px;margin-left:8px;padding:2px 10px 14px;color:var(--text);transform:rotate(-0.4deg);}
.kiosk-clock-time{font-family:var(--heading-font) !important;font-size:4.2rem;font-weight:500;line-height:.84;letter-spacing:-.02em;opacity:.88;}
.kiosk-clock-date{margin-top:6px;font-family:var(--heading-font) !important;font-size:1.42rem;font-weight:500;letter-spacing:.03em;opacity:.74;}
.kiosk-clock::after{content:"";position:absolute;left:-2px;bottom:0;width:calc(100% + 8px);height:3px;border-radius:999px;background:linear-gradient(90deg, transparent 0%, var(--line) 10%, var(--line-soft) 25%, var(--line) 48%, var(--line-soft) 76%, transparent 100%);}
:fullscreen .kiosk-clock{display:block;}
@media (display-mode: fullscreen){.kiosk-clock{display:block;}}
.kiosk-contact-note{display:none;width:190px;margin:0;padding:14px 14px 12px;position:absolute;left:225px;top:42px;z-index:4;font-family:var(--body-font);color:var(--text);transform:rotate(2.2deg);}
:fullscreen .kiosk-contact-note,html.raspberry-pi .kiosk-contact-note{left:225px;top:42px;}
@media (display-mode: fullscreen){.kiosk-contact-note{left:225px;top:42px;}}
.kiosk-contact-title{margin:2px 0 8px;font-size:1.05rem;font-weight:800;font-family:var(--card-font);}
.kiosk-contact-row{display:grid;grid-template-columns:72px 1fr;column-gap:6px;font-size:1rem;line-height:1.45;font-weight:600;}
:fullscreen .kiosk-contact-note{display:block;}
@media (display-mode: fullscreen){.kiosk-contact-note{display:block;}}
.footer{margin-top:8px;padding-top:0;padding-bottom:0;display:flex;justify-content:center;align-items:center;gap:12px;font-family:var(--body-font);position:relative;z-index:1;flex:0 0 auto;}
.footer-small{position:relative;padding:4px 10px;font-size:.96rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--footer-text);}
.footer-small::before,.footer-small::after{content:"";position:absolute;left:0;right:0;height:2px;background:var(--line-soft);}
.footer-small::before{top:0;}
.footer-small::after{bottom:0;}
.footer-logo{display:block;width:135px;max-width:45vw;height:auto;object-fit:contain;filter:drop-shadow(0 4px 6px rgba(0,0,0,.2));}
.calendar-section{margin-top:0;width:100%;padding:0 28px;position:relative;z-index:1;flex:0 0 auto;}
.calendar-section.no-events{display:none;}
.calendar-heading,.dashboard-heading,.weekly-schedule-heading{width:max-content;max-width:90%;margin:0 auto 20px;padding:10px 28px 9px;position:relative;font-family:var(--heading-font);font-size:1.34rem;font-weight:600;line-height:1.1;letter-spacing:.02em;text-align:center;color:var(--text);transform:rotate(-.25deg);}
.calendar-panel{width:100%;margin:0 auto;padding:0;font-family:var(--body-font);color:var(--text);background:none;border:none;border-radius:0;box-shadow:none;}
.calendar-weekdays{display:grid;grid-template-columns:90px repeat(7, 1fr);gap:0;margin-bottom:0;font-family:var(--card-font);font-size:1.02rem;font-weight:700;text-transform:uppercase;text-align:center;color:var(--text);}
.calendar-weekdays > div{position:relative;padding:5px 2px 8px;border-bottom:none;}
.calendar-weekdays > div::after{content:"";position:absolute;left:0;bottom:-1px;width:100%;height:2px;border-radius:99px;background:var(--line);opacity:.9;}
.calendar-month-label{display:flex;align-items:center;justify-content:center;padding:8px 6px;font-family:var(--card-font);font-size:.88rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text);border-right:2px solid var(--line);border-bottom:2px solid var(--line);}
.calendar-grid{display:grid;grid-template-columns:90px repeat(7, 1fr);gap:0;position:relative;}
.calendar-grid::before{content:"";position:absolute;left:0;top:1px;width:2px;height:calc(100% - 2px);border-radius:99px;background:var(--line);opacity:.9;}
.calendar-day{min-height:82px;padding:9px 9px;position:relative;background:none;border-radius:0;border-right:2px solid var(--line);border-bottom:2px solid var(--line);}
.calendar-day::after{content:"";position:absolute;top:1px;right:-2px;width:2px;height:calc(100% - 2px);border-radius:99px;background:var(--line-soft);opacity:.8;}
.calendar-day::before{content:"";position:absolute;left:1px;bottom:-2px;width:calc(100% - 2px);height:2px;border-radius:99px;background:var(--line-soft);opacity:.8;}
.calendar-day.other-month{opacity:.42;}
.calendar-day.today{box-shadow:inset 0 0 0 2px var(--accent);background:linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.02));}
.calendar-day.today .calendar-date{display:inline-flex;min-width:36px;height:36px;align-items:center;justify-content:center;border:2px solid var(--accent);border-radius:50%;padding:0 6px;}
.calendar-date{margin-bottom:5px;font-family:var(--card-font);font-size:1rem;font-weight:700;color:var(--text);}
.calendar-event{position:relative;display:block;width:calc(100% - 6px);margin:8px 3px 3px;padding:8px 7px 6px;border-radius:8px;font-family:var(--card-font);font-size:.88rem;line-height:1.2;font-weight:700;text-align:center;color:var(--event-text);background:linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,.02) 28%), linear-gradient(135deg, var(--event-bg), color-mix(in srgb, var(--event-bg) 82%, #000 18%));border:1px solid var(--event-border);box-shadow:0 4px 10px rgba(0,0,0,.10);transform:rotate(-.6deg);}
.calendar-event:nth-child(even){transform:rotate(.6deg);}
.calendar-event:nth-child(3n){transform:rotate(-.25deg);}
.weekly-schedule-section{width:min(86%, 1420px);margin:0 28px 8px auto;position:relative;z-index:1;font-family:var(--body-font);flex:0 0 auto;}
.weekly-schedule-wrap{display:grid;grid-template-columns:78px repeat(7, minmax(90px,1fr)) minmax(120px,1.15fr);grid-template-rows:42px minmax(82px,auto) minmax(82px,auto);align-items:stretch;position:relative;color:var(--text);}
.weekly-time-labels,.weekly-schedule-grid{display:contents;}
.weekly-time-labels .spacer{grid-column:1;grid-row:1;border-bottom:2px solid transparent;}
.weekly-time-label{display:flex;align-items:center;justify-content:center;padding:6px 4px;border-right:2px solid var(--line);border-bottom:2px solid var(--line);color:var(--text);font-weight:700;text-align:center;font-family:var(--card-font);}
.weekly-time-label:nth-child(2){grid-column:1;grid-row:2;}
.weekly-time-label:nth-child(3){grid-column:1;grid-row:3;}
.weekly-day-header,.weekly-slot,.weekly-always-slot{position:relative;border-right:2px solid var(--line);border-bottom:2px solid var(--line);}
.weekly-day-header{display:flex;align-items:center;justify-content:center;padding:5px 3px 8px;font-size:.98rem;font-weight:700;text-transform:uppercase;text-align:center;color:var(--text);font-family:var(--card-font);}
.weekly-slot,.weekly-always-slot{padding:9px 7px;display:flex;flex-wrap:wrap;align-content:flex-start;justify-content:center;gap:7px;background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.015));}
.weekly-always-slot{grid-column:9;grid-row:2 / span 2;align-content:center;}
.weekly-member{display:inline-block;position:relative;padding:5px 9px 4px;border-radius:8px;font-size:.9rem;line-height:1.05;font-weight:700;text-align:center;color:var(--tag_text);background:linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,.04) 28%), linear-gradient(135deg, var(--tag-bg), color-mix(in srgb, var(--tag-bg) 82%, #000 18%));border:1px solid var(--tag-border);box-shadow:0 3px 8px rgba(0,0,0,.08);transform:rotate(-.6deg);font-family:var(--card-font);}
.weekly-member:nth-child(even){transform:rotate(.5deg);}
.weekly-member:nth-child(3n){transform:rotate(-.15deg);}
.weekly-schedule-empty,.weekly-schedule-error{padding:14px;text-align:center;font-weight:700;opacity:.76;}
.dashboard-heading{margin-top:0;}
.content-stack{flex:1 1 auto;min-height:0;width:100%;display:flex;flex-direction:column;justify-content:space-between;gap:8px;position:relative;z-index:1;}
.dashboard-section{flex:0 0 auto;width:100%;}
.dashboard-section .rows{margin-bottom:0;}
.featured-row{margin-bottom:54px;grid-template-columns:110px minmax(0, 1fr);align-items:center;}
.featured-name{font-size:1rem;padding:7px 10px;}
.featured-lane .card{min-height:85px;}
.featured-lane .title2{font-size:clamp(1.125rem, 1.375vw, 1.35rem);}
.featured-lane .meta{font-size:.925rem;}
#night-screen{position:fixed;inset:0;background:#000;z-index:99999;display:none;}
html.hide-colored-bands .lane{background:transparent !important;border-color:var(--line-soft) !important;box-shadow:none !important;}
.weekly-wednesday-note{grid-column:4;grid-row:2 / span 2;align-self:center;justify-self:center;width:max-content;max-width:74%;padding:10px 14px 9px;position:relative;z-index:5;font-family:var(--card-font);font-size:.95rem;line-height:1;font-weight:800;text-align:center;color:var(--event-text);background:linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,.04) 28%), linear-gradient(135deg, var(--event-bg), color-mix(in srgb, var(--event-bg) 86%, #000 14%));border:1px solid var(--event-border);border-radius:8px;box-shadow:0 6px 12px rgba(0,0,0,.12);transform:translateY(-22px) rotate(-2.2deg);pointer-events:none;}
:fullscreen .pin-note{display:none;}
@media (display-mode: fullscreen) { .pin-note{display:none;} }
html.raspberry-pi, html.raspberry-pi body{width:100%;height:100%;margin:0;overflow:hidden;background:#000;}
html.raspberry-pi body{position:fixed;width:100vh;height:100vw;min-width:100vh;min-height:100vw;left:100vw;top:0;transform-origin:top left;transform:rotate(90deg);}
html.raspberry-pi .frame{width:100vh;min-width:100vh;height:100vw;min-height:100vw;}
html.raspberry-pi .board{width:calc(100vh - 32px);min-width:calc(100vh - 32px);height:calc(100vw - 32px);min-height:calc(100vw - 32px);}
@media (max-width:1180px){
  .top{grid-template-columns:1fr;justify-items:center;}
  .pin-note,.qr-note{width:min(100%,420px);}
  .user-row{grid-template-columns:1fr;}
  .name{justify-self:start;margin-left:12px;}
  .content-stack .weekly-schedule-section{margin-left:0;margin-right:0;width:100%;}
}
@media (max-width:860px){
  .calendar-section{padding-left:8px;padding-right:8px;}
  .calendar-heading,.dashboard-heading,.weekly-schedule-heading{font-size:1.5rem;padding:8px 22px 7px;}
  .calendar-weekdays{font-size:.65rem;}
  .calendar-day{min-height:56px;padding:5px 4px;}
  .calendar-date{font-size:.68rem;}
  .calendar-event{font-size:.62rem;padding:6px 4px 5px;}
  .lane{width:100%;flex-wrap:wrap;}
  .card{width:min(100%, 320px);transform:none !important;}
  .weekly-schedule-wrap{grid-template-columns:78px repeat(7,minmax(76px,1fr)) minmax(105px,1.1fr);}
  .weekly-member{font-size:.78rem;}
}
</style>
</head>

  <script>

const SHOW_COLORED_BANDS = false;  // true = visa färgade band, false = dölj dem
document.documentElement.classList.toggle('hide-colored-bands', !SHOW_COLORED_BANDS);



/* =========================================================
 * Veckoschema från Skroja_members.csv
 * ========================================================= */
const weeklyScheduleGrid = document.getElementById('weekly-schedule-grid');
const membersCsvFileName = 'Skroja_members.csv';

function normalizeText(value) {
  return String(value || '').trim();
}

function parseSemicolonCsv(text) {
  const lines = String(text || '')
    .replace(/^\uFEFF/, '')
    .split(/\r?\n/)
    .filter(line => line.trim() !== '');

  if (!lines.length) return [];

  const headers = lines[0]
    .split(';')
    .map(header => normalizeText(header).toLowerCase());

  return lines.slice(1).map(line => {
    const values = line.split(';');
    const record = {};
    headers.forEach((header, index) => {
      record[header] = normalizeText(values[index]);
    });
    return record;
  });
}

function getScheduleDayIndex(dayName) {
  const normalized = normalizeText(dayName).toLowerCase();
  const dayMap = {
    'måndag': 0,
    'mandag': 0,
    'tisdag': 1,
    'onsdag': 2,
    'torsdag': 3,
    'fredag': 4,
    'lördag': 5,
    'lordag': 5,
    'söndag': 6,
    'sondag': 6
  };
  return dayMap[normalized];
}

function getScheduleTimeRow(timeName) {
  const normalized = normalizeText(timeName).toLowerCase();
  if (normalized === 'förmiddag' || normalized === 'formiddag') return 2;
  if (normalized === 'eftermiddag') return 3;
  return null;
}

function createWeeklyMemberTag(name) {
  const tag = document.createElement('span');
  tag.className = 'weekly-member';
  tag.textContent = name;
  return tag;
}

function renderWeeklySchedule(members) {
  if (!weeklyScheduleGrid) return;
  weeklyScheduleGrid.innerHTML = '';

  const dayLabels = ['Mån','Tis','Ons','Tor','Fre','Lör','Sön','Alltid'];
  dayLabels.forEach((label, index) => {
    const header = document.createElement('div');
    header.className = 'weekly-day-header';
    header.textContent = label;
    header.style.gridColumn = String(index + 2);
    header.style.gridRow = '1';
    weeklyScheduleGrid.appendChild(header);
  });

  const slots = new Map();

  for (let row = 2; row <= 3; row++) {
    for (let col = 1; col <= 7; col++) {
      const slot = document.createElement('div');
      slot.className = 'weekly-slot';
      slot.style.gridColumn = String(col + 1);
      slot.style.gridRow = String(row);
      weeklyScheduleGrid.appendChild(slot);
      slots.set(`${row}-${col}`, slot);
    }
  }

  const alwaysSlot = document.createElement('div');
  alwaysSlot.className = 'weekly-always-slot';
  weeklyScheduleGrid.appendChild(alwaysSlot);

  /* Onsdagar är spärrade för Skröja. */
  const wednesdayNote = document.createElement('div');
  wednesdayNote.className = 'weekly-wednesday-note';
  wednesdayNote.textContent = 'Skröja';
  weeklyScheduleGrid.appendChild(wednesdayNote);

  let placedCount = 0;

  members.forEach(member => {
    const name = normalizeText(member.namn);
    const level = normalizeText(member.medlemsniva).toLowerCase();
    if (!name) return;

    if (level === 'alltid') {
      alwaysSlot.appendChild(createWeeklyMemberTag(name));
      placedCount++;
      return;
    }

    if (level !== 'ofta') return;

    const dayIndex = getScheduleDayIndex(member.dag);
    const row = getScheduleTimeRow(member.tid);
    if (dayIndex === undefined || row === null) return;

    /* Onsdag är reserverad för Skröja och visar därför inga medlemslappar. */
    if (dayIndex === 2) return;

    const targetSlot = slots.get(`${row}-${dayIndex + 1}`);
    if (!targetSlot) return;

    targetSlot.appendChild(createWeeklyMemberTag(name));
    placedCount++;
  });

  if (!placedCount) {
    const empty = document.createElement('div');
    empty.className = 'weekly-schedule-empty';
    empty.style.gridColumn = '1 / -1';
    empty.style.gridRow = '2 / span 2';
    empty.textContent = 'Inga schemalagda medlemmar hittades.';
    weeklyScheduleGrid.appendChild(empty);
  }

}

async function loadWeeklySchedule() {
  if (!weeklyScheduleGrid) return;

  try {
    const query = azureConfig.sasToken.replace(/^\?/, '');
    const membersCsvUrl = `${getBlobBaseUrl()}/${encodeURIComponent(membersCsvFileName)}?${query}&_=${Date.now()}`;
    const response = await fetch(membersCsvUrl, { cache:'no-store' });
    if (!response.ok) {
      throw new Error(`Kunde inte läsa ${membersCsvFileName} från Azure (${response.status})`);
    }

    const csvText = await response.text();
    const members = parseSemicolonCsv(csvText);

    renderWeeklySchedule(members);
    updateDashboardUsersFromMembers(members);

    /*
     * Om medlemslistan har ändrats måste även Anslagstavlan byggas om,
     * även om aktivitets-JSON-filerna är oförändrade.
     */
    if (hasLoadedOnce) {
      await loadActivities(true);
    }
  } catch (error) {
    console.error(error);
    weeklyScheduleGrid.innerHTML = '';
    const message = document.createElement('div');
    message.className = 'weekly-schedule-error';
    message.style.gridColumn = '1 / -1';
    message.style.gridRow = '1 / -1';
    message.textContent = 'Veckoschemat kunde inte läsa Skroja_members.csv';
    weeklyScheduleGrid.appendChild(message);
  }
}

    )
      .format(now)
      .replace('.', '')
      .toUpperCase();


  kioskClockDate.textContent =
    `${weekday} ${day} ${month}`;

function isRaspberryPi() {
  const params =
    new URLSearchParams(window.location.search);

  if (params.get('raspberrypi') === '1') {
    return true;
  }

  const userAgent =
    (navigator.userAgent || '').toLowerCase();

  const platform =
    (navigator.platform || '').toLowerCase();

  const isLinux =
    userAgent.includes('linux') ||
    platform.includes('linux');

  const isArm =
    userAgent.includes('arm') ||
    userAgent.includes('aarch64') ||
    platform.includes('arm') ||
    platform.includes('aarch64');

  return isLinux && isArm;
}

    function updateDashboardUsersFromMembers(members) {
      const seen = new Set();

      members.forEach(member => {

        const key = name.toLowerCase();
        if (seen.has(key)) return;
        seen.add(key);

        });

          laneClass: 'lane-blue',
          featured: true
        });
      }

      users = dynamicUsers;

async function listJsonBlobs() {
  const { accountName, containerName, sasToken } = azureConfig;
  if (!accountName || !containerName || !sasToken || sasToken.includes('PASTA_IN')) {
    throw new Error('Azure-inställningar saknas. Lägg in en giltig SAS-token i dashboardfilen.');
  }

  const query = sasToken.replace(/^\?/, '');
  const url = `https://${accountName}.blob.core.windows.net/${containerName}?restype=container&comp=list&include=metadata&${query}`;
  const response = await fetch(url);
  if (!response.ok) throw new Error(`Kunde inte läsa från Azure (${response.status}).`);

  const xml = await response.text();
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  const blobNodes = Array.from(doc.querySelectorAll('Blob'));

  return blobNodes
    .map(blob => {
      const name = blob.querySelector('Name')?.textContent || '';
      const lastModified = blob.querySelector('Properties > Last-Modified')?.textContent || '';
      return { name, lastModified };
    })
    .filter(blob => blob.name.endsWith('.json'));
}

    async function readJsonRecord(fileName) {
      const query = azureConfig.sasToken.replace(/^\?/, '');
      const url = `${getBlobBaseUrl()}/${encodeURIComponent(fileName)}?${query}`;
      const response = await fetch(url);
      if (!response.ok) throw new Error(`Kunde inte läsa ${fileName}`);
      return response.json();
    }

function isNightMode() {
  const now = new Date();
  const minutes = now.getHours() * 60 + now.getMinutes();
  return minutes >= (22 * 60 + 30) || minutes < (7 * 60 + 30);
}

function updateNightMode() {
  const night = isNightMode();
  nightScreen.style.display = night ? 'block' : 'none';
}

async function safeLoadActivities() {

    updateNightMode();
    return;

  try {

    if (pollStatus) pollStatus.textContent = '';

async function loadActivities(force = false) {
  if (pollStatus) pollStatus.textContent = '';

  const files = await listJsonBlobs();

  const sortedFiles = files
    .slice()
    .sort((a, b) =>
      a.name.localeCompare(b.name)
    )
    .reverse();

  /*
   * Signaturen innehåller ALLA JSON-filer.
   *
   * Därmed märker dashboarden:
   * - ny aktivitet
   * - borttagen aktivitet
   * - ändrad aktivitet
   * - nytt/borttaget kalenderevent
   */
  const fileSignature = sortedFiles
    .map(file =>
      `${file.name}:${file.lastModified}`
    )
    .join('|');

  if (
    !force &&
    hasLoadedOnce &&
    fileSignature === lastSeenFileSignature
  ) {
    return;
  }

  lastSeenFileSignature = fileSignature;
  hasLoadedOnce = true;

  /*
   * Läs alla JSON-poster.
   *
   * Det behövs för kalendern eftersom ett framtida event
   * kan ha skapats för länge sedan.
   */
  const allFiles =
    sortedFiles.map(file => file.name);

  const records = await Promise.all(
    allFiles.map(readJsonRecord)
  );

  /*
   * --------------------------------
   * KALENDER
   * --------------------------------
   */

  const calendarEvents = records
    .filter(record =>
      record &&
      record.activity === 'Kalenderevent' &&
      record.eventDate
    );

  renderCalendar(calendarEvents);

  /*
   * --------------------------------
   * VANLIGA AKTIVITETER
   * --------------------------------
   */

  const cutoff =
    Date.now() -
    (14 * 24 * 60 * 60 * 1000);

  const byUser = Object.fromEntries(
    users.map(user => [user.name, []])
  );

  records
    .filter(record =>
      record &&
      record.member &&
      record.timestamp
    )

    .filter(record => {
      const ts =
        new Date(record.timestamp).getTime();

      return (
        Number.isFinite(ts) &&
        ts >= cutoff
      );
    })

    /*
     * Kalenderevent ska INTE visas
     * som vanliga aktivitetskort.
     */
    .filter(record =>
      record.activity !== 'Kalenderevent'
    )

    .filter(record =>
      !hiddenActivities.includes(
        record.activity
      )
    )

    .sort(
      (a, b) =>
        new Date(b.timestamp) -
        new Date(a.timestamp)
    )

    .forEach(record => {
      if (!byUser[record.member]) return;

      if (
        record.member === 'Lerverkstan' ||
        byUser[record.member].length < 4
      ) {
        byUser[record.member].push(record);
      }
    });

  renderRows(byUser);

  if (pollStatus) {
    pollStatus.textContent = '';
  }
}

function renderCalendar(events) {
  if (!calendarPanel || !calendarGrid) return;

  const validEvents = events
    .filter(event =>
      event &&
      event.activity === 'Kalenderevent' &&
      event.eventDate
    )
    .sort((a, b) =>
      a.eventDate.localeCompare(b.eventDate)
    );

  const today = new Date();

  // Måndag i nuvarande vecka
  const calendarStart = new Date(today);

  const daysSinceMonday =
    (today.getDay() + 6) % 7;

  calendarStart.setDate(
    today.getDate() - daysSinceMonday
  );

  calendarStart.setHours(0, 0, 0, 0);

  calendarGrid.innerHTML = '';

  /*
   * 6 veckor
   */
  for (let week = 0; week < 6; week++) {

    /*
     * -----------------------------------------
     * Bestäm vilken månad som "vinner" veckan
     * -----------------------------------------
     */

    const monthCounts = new Map();

    for (let dayIndex = 0; dayIndex < 7; dayIndex++) {

      const date = new Date(calendarStart);

      date.setDate(
        calendarStart.getDate() +
        week * 7 +
        dayIndex
      );

      const key =
        `${date.getFullYear()}-${date.getMonth()}`;

      if (!monthCounts.has(key)) {
        monthCounts.set(key, {
          count:0,
          date:new Date(date)
        });
      }

      monthCounts.get(key).count++;
    }

    const winningMonth =
      [...monthCounts.values()]
        .sort((a, b) =>
          b.count - a.count
        )[0];

    /*
     * Månad till vänster
     */

    const monthLabel =
      document.createElement('div');

    monthLabel.className =
      'calendar-month-label';

    const monthName =
      new Intl.DateTimeFormat(
        'sv-SE',
        { month:'short' }
      )
        .format(winningMonth.date)
        .replace('.', '');

    monthLabel.textContent =
      monthName;

    calendarGrid.appendChild(
      monthLabel
    );


    /*
     * -----------------------------------------
     * Veckans 7 dagar
     * -----------------------------------------
     */

    for (let dayIndex = 0; dayIndex < 7; dayIndex++) {

      const i =
        week * 7 + dayIndex;

      const currentDate =
        new Date(calendarStart);

      currentDate.setDate(
        calendarStart.getDate() + i
      );

      const year =
        currentDate.getFullYear();

      const month =
        currentDate.getMonth();

      const day =
        currentDate.getDate();

      const dateString = [
        year,
        String(month + 1).padStart(2, '0'),
        String(day).padStart(2, '0')
      ].join('-');


      const dayElement =
        document.createElement('div');

      dayElement.className =
        'calendar-day';


      /*
       * Idag
       */

      const isToday =
        year === today.getFullYear() &&
        month === today.getMonth() &&
        day === today.getDate();

      if (isToday) {
        dayElement.classList.add('today');
      }


      /*
       * Datum
       */

      const dateElement =
        document.createElement('div');

      dateElement.className =
        'calendar-date';

      dateElement.textContent =
        day;

      dayElement.appendChild(
        dateElement
      );


      /*
       * Event
       */

      const todaysEvents =
        validEvents.filter(event =>
          event.eventDate === dateString
        );

      todaysEvents.forEach(event => {

        const eventElement =
          document.createElement('div');

        eventElement.className =
          'calendar-event';

        eventElement.textContent =
          event.eventDescription ||
          'Kalenderevent';

        dayElement.appendChild(
          eventElement
        );
      });

      calendarGrid.appendChild(
        dayElement
      );
    }
  }
}

function scheduleDailyCodeReload() {
  function scheduleNextReload() {
    const now = new Date();
    const nextReload = new Date(now);

    nextReload.setHours(6, 0, 0, 0);

    if (now >= nextReload) {
      nextReload.setDate(nextReload.getDate() + 1);
    }

    const delay = nextReload.getTime() - now.getTime();

    setTimeout(() => {
      const url = new URL(window.location.href);

      // Forces the browser/CDN to request the newest HTML.
      url.searchParams.set('_refresh', Date.now());

      // Reload at 06:00 every morning without adding browser history.
      window.location.replace(url.toString());
    }, delay);
  }

  scheduleNextReload();
}

function setupKioskMouseCursor() {
  let mouseHideTimer = null;

  function showMouseCursor() {
    document.body.style.cursor = 'default';

    if (mouseHideTimer) {
      clearTimeout(mouseHideTimer);
    }

    mouseHideTimer = setTimeout(() => {
      document.body.style.cursor = 'none';
    }, 3000);
  }

  document.addEventListener('mousemove', showMouseCursor);
  document.addEventListener('mousedown', showMouseCursor);
  document.addEventListener('wheel', showMouseCursor);

  showMouseCursor();
}
